name: tests

# Runs the regression suites that can run on a clean checkout (see ci_suite.py and CI-TESTS.md) on
# every pull request and every push to main. Needs no secrets: the suites that need the gitignored
# board inputs, a real opt-out ledger or a browser are skipped by name, each with its reason.
# Read-only token; it never writes to the repo, never opens issues and never touches the live board.

on:
  pull_request:
  push:
    branches: [main]
    # The runners' nightly/morning publishes change only the built board under docs/ - no code, so
    # nothing for the suites to say. Any push that touches anything else still runs.
    paths-ignore: ['docs/**']
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suites:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Python dependencies
        # requirements.txt is the CI set already (camoufox and anthropic are LOCAL ONLY there).
        # `pip install playwright` installs the library, not the browsers - browser suites are skipped.
        run: python -m pip install -r requirements.txt
      - name: What runs and what is skipped
        run: python ci_suite.py --list
      - name: Run the suites
        run: python ci_suite.py
