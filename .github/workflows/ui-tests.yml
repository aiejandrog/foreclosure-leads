name: Synthetic browser UI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s ui_tests -v
      - name: Build reproducible browser container
        run: docker build -f Dockerfile.ui -t dealflow-ui .
      - name: Run UI suite in isolated container
        run: docker run --rm --network none -v "$PWD:/app:ro" dealflow-ui
