name: DEALFLOW Daily Refresh

# Runs the same pipeline refresh-dealflow.bat does on Alejandro's Windows machine, but on
# GitHub-hosted Ubuntu. Fires daily at 13:00 UTC (09:00 EDT / 08:00 EST — DST-drifts by 1h
# in winter, still hits morning) and can be manually kicked from the Actions tab.
#
# This is the durable replacement for the "DEALFLOW Refresh" Windows Task Scheduler entry that
# timed out and killed the pipeline on 2026-07-18. Every step's failure surfaces via GitHub's
# built-in workflow-failure email — no more silent rot on the live site.
#
# Sequencing matches the bat exactly, including the "publish fresh leads NOW, then enrich, then
# publish again" two-phase pattern that guarantees SOMETHING lands on docs/index.html even if a
# later slow step (skiptrace, photos) hangs.

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  # Only one refresh at a time — never let a manual run collide with the daily cron and
  # step on itself with two concurrent pushes.
  group: dealflow-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Every scraper checks env FIRST, then falls back to a gitignored *.key file. On GHA
      # only env is available; on Alejandro's local machine only files are.
      GOOGLE_STREET_VIEW_KEY: ${{ secrets.GOOGLE_STREET_VIEW_KEY }}
      TRACERFY_API_KEY: ${{ secrets.TRACERFY_API_KEY }}
      # BATCHDATA DISABLED IN THE CLOUD (2026-08-02). BatchData bills per call, and this runner
      # spends the SAME wallet as the laptop -- but bd_budget.py's shared daily ledger is a file on
      # disk, so a cloud run cannot see what the laptop already spent, or vice versa. Two
      # ungoverned spenders on one balance is exactly how $50 vanished in five minutes. Phones and
      # liens are now owned by the local nightly job, which IS under the shared cap.
      # To re-enable: restore the secret line AND give the runner a budget the ledger can enforce
      # (persist batchdata_spend.json via actions/cache and hard-fail the step when it is spent).
      # BATCHDATA_API_KEY: ${{ secrets.BATCHDATA_API_KEY }}
      BATCHDATA_API_KEY: ''
      # accept whatever the WP Pro secret is named in the repo settings
      WHITEPAGES_KEY: ${{ secrets.WHITEPAGES_KEY || secrets.WHITEPAGES_API_KEY || secrets.WP_PRO_KEY }}
      # Gmail App Password for reply detection. Accept "user@domain:apppassword" in one secret, or
      # a password-only secret plus GMAIL_ACCOUNT. NOT a Google account password — an App Password
      # (myaccount.google.com -> Security -> App passwords), which is revocable on its own.
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD || secrets.GMAIL_KEY }}
      GMAIL_ACCOUNT: ${{ secrets.GMAIL_ACCOUNT }}
      # accept whatever you named the 2Captcha secret — no need to match one exact name
      CAPTCHA_KEY: ${{ secrets.CAPTCHA_KEY || secrets.TWOCAPTCHA_KEY || secrets.CAPTCHA || secrets.TWO_CAPTCHA_KEY || secrets.TWOCAPTCHA }}
      TWOCAPTCHA_KEY: ${{ secrets.CAPTCHA_KEY || secrets.TWOCAPTCHA_KEY || secrets.CAPTCHA || secrets.TWO_CAPTCHA_KEY || secrets.TWOCAPTCHA }}
      # Skip the "Desktop tracker + daily CSV" write entirely on the runner (DEALFLOW_NO_DESKTOP
      # guard in foreclosure_leads.py — the OneDrive path only exists on Alejandro's machine).
      DEALFLOW_NO_DESKTOP: '1'
      # Same 8-min link-generator budget the local pipeline uses.
      GEN_DEADLINE: '480'
      # Keep pip/apt quiet.
      PIP_DISABLE_PIP_VERSION_CHECK: '1'

    steps:
      - name: Checkout (with push token)
        uses: actions/checkout@v4
        with:
          # Needed so the later `git push` uses a token with contents:write on THIS repo.
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      # State persistence — CRITICAL. Runners start from a bare checkout, but the pipeline's
      # per-day state files are gitignored by design. Without this cache:
      #  - skiptrace_results.json empty -> skiptrace.py would RE-PAY to re-trace ~640 leads
      #    every single run (~$60-95/day of pure waste)
      #  - broward/palmbeach_leads.json missing -> a bot-walled county day publishes the site
      #    WITHOUT that county instead of keeping last-good data
      #  - records_liens --cached-only has no cache -> Miami-Dade lien chains silently vanish
      #  - broward/palmbeach_liens.json missing -> every run re-traces the WHOLE county book
      #    (and the rebuilt site ships with zero Broward/PB chains until it finishes)
      # Saved on green runs; a failed day just restores the previous day's state.
      # RESTORE ONLY. The save half is a separate step at the very END with `if: always()`.
      # Why: actions/cache@v4's implicit post-save runs ONLY when the job succeeds. That produced a
      # death spiral — the Health step failed on thin coverage, which failed the job, which SKIPPED
      # the cache save, so the next run restored the same thin cache and failed identically. Seven of
      # the last nine scheduled runs died this way and it could not self-heal, because every scraper
      # output here is gitignored and lives ONLY in this cache (CI has no 2Captcha key, so Miami-Dade
      # liens can never be regenerated in the cloud — the cache is their sole source).
      - name: Restore pipeline state (leads, phones, liens, link tokens)
        id: statecache
        uses: actions/cache/restore@v4
        with:
          path: |
            leads_final.json
            leads_raw.json
            broward_leads.json
            palmbeach_leads.json
            skiptrace_results.json
            cases_qs.json
            records_qs.json
            records_liens.json
            judgment_dates.json
            auction_archive.json
            cash_buyers.json
            broward_liens.json
            palmbeach_liens.json
            batchdata_liens.json
            county_plaintiffs.json
            lis_pendens.json
            lp_leads.json
            lp_addresses.json
            _lp_pagis_cache.json
            _lp_values_cache.json
            _lp_status_cache.json
            _code_liens_cache.json
            code_liens.json
            _county_taxes_cache.json
            county_taxes.json
            replies.json
            whitepages_lookup.json
            geocode_cache.json
            tax_links.json
            comps.json
            property_types_cache.json
            listing_status_cache.json
            redfin_cache.json
            health.json
            full.json
          # v8 namespace: actions/cache derives an internal VERSION hash from the `path:` list, and a
          # cache saved under a different path list is invisible even to a matching restore-key prefix.
          # Adding whitepages_lookup.json silently orphaned every earlier cache — the restore logged
          # "Cache not found for input keys: dealflow-state-…, dealflow-state-" while a 0.2MB
          # dealflow-state cache sat right there in the repo. Bump this suffix ON PURPOSE whenever the
          # path list changes, so the invalidation is deliberate and greppable instead of a mystery.
          # v10 -> v11 (2026-08-04): added auction_archive.json + cash_buyers.json (self-building buyer list).
          # v9 -> v10 (2026-08-04): added judgment_dates.json (post-judgment interest entry dates).
          # v2 -> v5 (all 2026-07-30, before any of them ran — still ONE cold run, not four): v3 added the lis-pendens address
          # resolver caches (lp_addresses.json, _lp_pagis_cache.json, _lp_values_cache.json) so the
          # parcel roll is not re-queried cold every morning; v4 added replies.json so a day with no
          # new reply keeps yesterday's rather than blanking the Reply Inbox.
          # v8 -> v9 (2026-08-02): added redfin_cache.json (Redfin Estimate sidecar).
          # EXPECT ONE COLD RUN after this lands — that is the bump working, not a failure.
          key: dealflow-state-v11-${{ github.run_id }}
          restore-keys: dealflow-state-v11-
      # sale_history_cache.json is deliberately NOT in the actions/cache list above: it is COMMITTED
      # to the repo (local Claude/Kimi runs keep it current), and the restore step was SHADOWING the
      # fresh committed copy with a stale runner copy — which could ship the site with partial
      # stay-compliance coverage. One source of truth: the checked-out file.

      # Access codes — CRITICAL. make_tracker encrypts docs/index.html with the per-person codes
      # from site.codes (gitignored, never committed). If this file is absent on the runner,
      # _load_codes() returns [] and the build goes out PUBLIC + PHONE-FREE + GATELESS — silently
      # downgrading the live site for all 6 code holders. Abort instead.
      - name: Access codes for the encrypted build (site.codes from secret)
        run: |
          printf '%s\n' "${{ secrets.SITE_CODES }}" > site.codes
          test -s site.codes || { echo "::error::SITE_CODES secret is missing — refusing to publish an UNENCRYPTED build. Add it in repo Settings -> Secrets."; exit 1; }

      # Scrapers read a gitignored *.key file first (or the env var). Materialize the key files from the
      # repo secrets so the CLOUD run has the SAME capability as the local machine: 2Captcha (Turnstile +
      # Broward reCAPTCHA), BatchData (phones + Palm Beach liens), Tracerfy (cheaper phones).
      - name: API keys for the scrapers (secrets -> gitignored *.key)
        run: |
          [ -n "$BATCHDATA_API_KEY" ] && printf '%s' "$BATCHDATA_API_KEY" > batchdata.key || true
          [ -n "$TRACERFY_API_KEY"  ] && printf '%s' "$TRACERFY_API_KEY"  > tracerfy.key  || true
          [ -n "$CAPTCHA_KEY"       ] && printf '%s' "$CAPTCHA_KEY"       > captcha.key   || true
          # replies.py reads env directly, but write the file too so a local-style run inside CI
          # behaves identically to Alejandro's machine — one code path, not two.
          [ -n "$GMAIL_APP_PASSWORD" ] && printf '%s' "$GMAIL_APP_PASSWORD" > gmail.key    || true
          echo "keys -> batchdata=$([ -s batchdata.key ] && echo Y || echo N) tracerfy=$([ -s tracerfy.key ] && echo Y || echo N) captcha=$([ -s captcha.key ] && echo Y || echo N)"

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # ---- [1/5] Miami-Dade scrape + enrich + first tracker rebuild -------------------------
      - name: '[1/5] Pull new auction leads (MD scrape + enrich)'
        run: python foreclosure_leads.py

      # ---- [1b/5] Publish fresh leads immediately (mirrors the bat) ------------------------
      # Rationale: if a later enrichment step (skiptrace, photos, county merge) hangs, at
      # least the newest MD leads already landed on docs/index.html. Same reasoning the local
      # bat uses.
      - name: '[1b/5] Publish fresh leads NOW'
        run: |
          # COMPLIANCE FIRST: the fresh scrape has no sale-history fields yet, so the build [1/5]
          # just produced would ship every stay-active lead (67 on 2026-07-21) with LIVE outreach
          # buttons — §362 landmines — until the final publish ~40 min later. Apply the committed
          # cache fetch-free and rebuild, THEN publish: yesterday's stay flags beat a naked board.
          python sale_history.py --cache-only
          python -c "import json, foreclosure_leads as F; F.make_tracker(json.load(open('leads_final.json',encoding='utf-8')))"
          # Same guard as [5/5], and it matters MORE here: this build runs before any enrichment
          # step, so on a cold cache it is the nakedest board of the whole run — it is what produced
          # the 1.5MB commit that replaced a 3.6MB live board. Blocking costs nothing in compliance
          # terms: the live board stays as it was, and it already carries yesterday's stay flags.
          if ! python publish_guard.py; then
            echo "::warning::Early publish SKIPPED — build lacks enrichment vs the live board. Site left untouched; the final publish will retry after enrichment."
            exit 0
          fi
          git add docs/index.html
          if git diff --staged --quiet; then
            echo "no change — nothing to publish yet"
          else
            git commit -m "refresh: fresh leads (auto)"
            # Three writers hit main (Claude, Kimi, this pipeline) — a bare push loses the race the
            # moment anyone lands a commit mid-run (2026-07-21: run died here, all enrichment
            # skipped). Rebase-with-retry; on a docs/index.html conflict the freshly built file
            # wins (-X theirs during rebase = OUR replayed commit — generated artifact, newest is truth).
            for i in 1 2 3; do
              git pull --rebase --autostash -X theirs origin main && git push origin HEAD:main && break
              [ "$i" = 3 ] && exit 1
              sleep 10
            done
          fi

      # ---- [1c/5] Broward + Palm Beach scrape ---------------------------------------------
      # Per-county try/except: a thin/blocked county keeps its last-good *_leads.json
      # (make_tracker glob-merges every *_leads.json at rebuild time, so a broken county just
      # falls back to yesterday's data instead of blanking the site).
      - name: '[1c/5] Broward + Palm Beach scrape'
        continue-on-error: true
        run: |
          set +e
          python county_leads.py --county broward
          bw=$?
          python county_leads.py --county "palm beach"
          pb=$?
          echo "broward exit=$bw · palm beach exit=$pb"
          # Never fail the whole workflow on one blocked county.
          exit 0

      # ---- [2/5] Link generators (bounded by GEN_DEADLINE) --------------------------------
      - name: '[2/5] Generate court-case + records-search links'
        continue-on-error: true
        run: |
          python gen_cases_qs.py --limit 40
          python gen_records_qs.py --limit 40

      # ---- [2c/5] Deep per-parcel tax links (Broward; Algolia-minted account URLs) --------
      - name: '[2c/5] Deep tax links (Broward parcels)'
        continue-on-error: true
        run: python gen_tax_links.py --limit 60

      # ---- [2d/5] Radius comps -> ARV (ALL 3 counties) ------------------------------------
      # comps.py enriches every county: Broward + Palm Beach off the FL statewide cadastral, and
      # Miami-Dade off the county's OWN MD_ComparableSales layer (gisweb.miamidade.gov). New-only
      # + cached in comps.json, so future scrapes keep every new lead in ARV coverage automatically.
      # Do NOT scope this back to BW+PB — MD leads would silently lose their ARV. The healthcheck
      # RULE: ARV-comp coverage assertion goes RED (emails the owner) if this ever regresses.
      - name: '[2d/5] Radius comps -> ARV (Miami-Dade + Broward + Palm Beach)'
        continue-on-error: true
        run: python comps.py --limit 120

      # ---- [2b/5] Recorded mortgage chains -------------------------------------------------
      - name: '[2b/5] Recorded mortgage chains + senior-survives classification'
        continue-on-error: true
        run: |
          # With the 2Captcha key present, MD mints NEW Turnstile chains (not just cached); caps bound spend.
          if [ -s captcha.key ]; then python records_liens.py --all --limit 60; else python records_liens.py --all --cached-only; fi
          if [ -f broward_leads.json ]; then python broward_liens.py --all; fi
          if [ -s batchdata.key ]; then python batchdata_liens.py --all --limit 80; fi
          # Broward plaintiff -> bank-1st(clean) vs junior/HOA(senior survives). PB is headed-browser (--pb) = local only.
          if [ -s captcha.key ] && [ -f broward_leads.json ]; then python county_plaintiffs.py --county broward --near --limit 60; fi

      # ---- [2c/5] Fresh LIS PENDENS front-of-funnel -------------------------------------------
      # The docket-wide blank-name sweep is walled, but NAME searches aren't: sweep the ~34 lenders who
      # file most foreclosures over a rolling ISO window, keep the LIS PENDENS, dedupe -> the owner the
      # DAY their case is filed. lp_leads.py shapes them into st='LP' board leads (Fresh-filings lane).
      # lp_resolve.py sits BETWEEN the sweep and lp_leads.py on purpose. A lis pendens names the
      # property by legal description, never by folio or street address, so without this step every
      # LP lead lands on the board with addr='' — un-skiptraceable, un-mappable, un-mailable, and the
      # Morning Worker's EARLY lane reads 0 workable. lp_resolve matches the legal description against
      # the free Miami-Dade parcel roll (MDC.PaGis, no key, no captcha) and grades every hit; lp_leads
      # then fills addr/folio from the `high` rows ONLY. Ordering matters — lp_leads reads the file
      # lp_resolve writes, so a swap here silently reverts us to blank addresses.
      # ---- [2b1/5] Code-enforcement liens (free Miami-Dade CCVIOL ArcGIS, folio-keyed) ---------
      # A code lien is a junior lien invisible to the mortgage chain — the thing that turns a
      # "90% equity" lead into a loss. Free, no key, no captcha; cross-references every MD folio.
      - name: '[2b1/5] Code-enforcement liens (Miami-Dade)'
        continue-on-error: true
        run: python code_liens.py

      # ---- [2b2/5] Delinquent property taxes, Miami-Dade + Broward (Playwright past Cloudflare) --
      # First-priority lien that survives foreclosure (FS 197.122), invisible to the mortgage chain.
      # The cap is deliberately SMALL: short runs render ~83% at ~9.3s/parcel, but a 202-parcel run
      # degraded to 24% at 41.7s/parcel because the county throttles sustained load. Chipping away
      # 60/morning beats one long run. Unrendered parcels are never cached, so they simply retry.
      # Palm Beach is not on this platform (see county_taxes.py) and never gets a false $0.
      - name: '[2b2/5] County back-taxes MD+BW (verified, capped)'
        continue-on-error: true
        run: python county_taxes.py --limit 60 --conc 4

      # ---- [2b3/5] Judgment ENTRY DATES -> post-judgment interest (FS 55.03) ---------------------
      # A judgment is frozen at entry; the real payoff keeps accruing at the rate the FJ recites and
      # RESETS every January 1. The counties publish the amount but never the date, so without this
      # step the bake cannot accrue and every new lead publishes a frozen — i.e. overstated — equity
      # number until someone runs it by hand. The first full pull was worth $15.3M of unseen debt
      # across 298 rows and flipped 10 verdicts, one of them a STRONG that was really a PASS.
      # Incremental by design: judgment_interest.py caches HITS AND MISSES in judgment_dates.json and
      # skips anything already there, so a normal night pulls only the handful of new cases.
      # continue-on-error: a clerk outage must never block the rebuild — undated rows just stay
      # labeled "as entered" rather than guessing a payoff (NO DATE -> NO ACCRUAL, EVER).
      - name: '[2b3/5] Judgment entry dates (Miami-Dade docket) -> post-judgment interest'
        continue-on-error: true
        run: python judgment_interest.py --all --limit 120

      - name: '[2c/5] Fresh Lis Pendens (lender-sweep -> resolve addresses -> lp_leads.json)'
        continue-on-error: true
        run: |
          if [ -s captcha.key ]; then python lis_pendens.py --days 30; fi
          if [ -f lis_pendens.json ]; then python lp_resolve.py; fi
          if [ -f lp_addresses.json ]; then python lp_values.py; fi
          # Is the case still alive? A lis pendens stays recorded forever, so nothing in the feed
          # says the foreclosure ended. 8 of the current 125 are voluntarily dismissed — without
          # this they sit in the EARLY lane looking fresh and somebody calls a homeowner about a
          # case that no longer exists. Must run BEFORE lp_leads.py, which reads its cache.
          if [ -f lis_pendens.json ]; then python lp_status.py; fi
          if [ -f lis_pendens.json ]; then python lp_leads.py; fi

      # ---- [2d/5] Geocode leads (keyless US Census) -> lat/lng for the origin-anchored door route -----
      - name: '[2d/5] Geocode leads (US Census) -> lat/lng'
        continue-on-error: true
        run: python geo_enrich.py

      # ---- [3/5] Skip-trace phones (only if a key is present) -----------------------------
      - name: '[3/5] Humans behind LLCs (Sunbiz) + skip-trace phones (all tiers, capped)'
        if: env.TRACERFY_API_KEY != '' || env.BATCHDATA_API_KEY != ''
        continue-on-error: true
        run: |
          python llc_officers.py --limit 60
          python skiptrace.py --all --limit 120

      # ---- [3a2/5] Whitepages Pro API — one paid /v2/property call returns EVERY owner + resident
      # with typed phones (mobile/landline UNMASKED) + emails + current mailing city. Absentee-owner
      # detection is the killer feature (Velima: her co-owner Jacob is in Lewisville TX → call, don't
      # knock). --limit 30 caps a single run; already-cached leads are skipped so it stays incremental.
      # Est ~$0.10/call. Only runs when the WHITEPAGES_KEY secret is set.
      - name: '[3a2/5] Whitepages Pro household lookups'
        if: env.WHITEPAGES_KEY != ''
        continue-on-error: true
        run: |
          echo -n "${WHITEPAGES_KEY}" > whitepages.key
          python whitepages_lookup.py --all --limit 30

      # ---- [3b/5] Property photos (Zillow + Street View + aerials) ------------------------
      - name: '[3b/5] Property photos'
        continue-on-error: true
        run: python property_photos.py --zillow

      # ---- [3c/5] Property types (BCPA + PBCPAO -> dor_desc for BW/PB) --------------------
      # Miami-Dade already gets dor_desc from apps.miamidadepa.gov via county_leads.py. BW/PB
      # need a separate fetch — the county scrapes don't include use codes. Cached per folio in
      # property_types_cache.json (via the actions/cache step above) so we only pay for BRAND-NEW
      # leads each day. Fail-soft: any parse/HTTP error leaves dor_desc blank on that lead and
      # the tracker renders no ptype chip; never blocks the workflow.
      - name: '[3c/5] Property types (Broward + Palm Beach)'
        continue-on-error: true
        run: python property_types.py

      # ---- [3d/5] Zillow listing status (LISTED / PENDING / SOLD / RENTAL / OFF-MARKET) ----
      # 7-day TTL cache (listing_status_cache.json) so only ~1/7th of leads re-check daily.
      # --limit 120 caps a cold-cache day at ~5 min so this step can never eat the job window.
      - name: '[3d/5] Zillow listing status'
        continue-on-error: true
        run: python listing_status.py --limit 120

      # ---- [3d2/5] Redfin Estimate (advisory AVM cross-check) -------------------------------------
      # BEST-EFFORT in the cloud: Redfin, like Zillow (see the photo_seed note in foreclosure_leads.py),
      # will likely block this datacenter IP — that's fine. Failures are never cached, so a blocked
      # cloud run costs nothing; the real fetching happens in the LOCAL nightly (residential IP,
      # refresh-dealflow.bat) and its 21-day cache — restored below — still bakes the values here.
      - name: '[3d2/5] Redfin Estimate (advisory)'
        continue-on-error: true
        run: python redfin_value.py --limit 100

      # ---- [3e/5] Sale-history survival count (the REAL staller signal, Miami-Dade docket) --------
      # Counts how many scheduled foreclosure sales each owner has already dodged (cancelled/reset),
      # straight from the MD Clerk OCS docket — free, same endpoint the clerk-enrich already hits.
      # 7-day TTL (the count changes when a new sale is set/cancelled). Feeds the FRESH/STALLER chip
      # and keeps serial stallers OUT of the Closers list. Broward/PB fall back to the filing-year proxy.
      - name: '[3e/5] Sale-history survival count (Miami-Dade)'
        continue-on-error: true
        run: python sale_history.py --limit 150

      # ---- [3f/5] Humans behind LLC-owned leads (Sunbiz officers/RA) -----------------------
      # llc_officers.json is COMMITTED (same single-source rule as the stay cache); only new
      # cases hit Sunbiz. Fail-soft: a blocked day keeps yesterday's humans.
      - name: '[3f/5] LLC officers (Sunbiz)'
        continue-on-error: true
        run: python llc_officers.py --limit 40

      # ---- [3g/5] Owner replies (IMAP) ----------------------------------------------------
      # MUST run before [4/5]: make_tracker bakes replies.json into the page, so a reply detected
      # after the rebuild would not surface until the NEXT day's run. This was the last enrichment
      # step that only existed on Alejandro's machine — the Reply Inbox went stale between manual
      # runs, and a reply is the single warmest signal on the board. A STOP word in a reply is also
      # an opt-out we are legally obliged to honour (FTSA/TCPA), so detecting it a day late is not
      # a cosmetic delay.
      # Fail-soft: no secret, or Gmail refusing the login, leaves yesterday's replies.json in place
      # and the board keeps saying "awaiting reply" — the honest state, never a fabricated one.
      - name: '[3g/5] Owner replies (Gmail IMAP -> replies.json)'
        if: env.GMAIL_APP_PASSWORD != ''
        continue-on-error: true
        run: |
          python replies.py --days 30
          python -c "import json,os; d=json.load(open('replies.json',encoding='utf-8')) if os.path.exists('replies.json') else {}; a=[k for k in d if k.startswith('@')]; s=[k for k in a if (d[k] or {}).get('stop')]; print('::notice::replies: %d address(es) replied, %d with a STOP word' % (len(a), len(s))); print('::warning::STOP words in replies — add them to optouts.json before any further contact' if s else '')"

      # ---- [4/5] Final rebuild with everything baked in -----------------------------------
      - name: '[4/5] Rebuild site (cases + phones + photos + liens)'
        run: |
          python -c "import json, foreclosure_leads as F; F.make_tracker(json.load(open('leads_final.json',encoding='utf-8')))"

      # ---- [4b/5] Remember today's calendar, then harvest matured sales for BUYERS -------------
      # The pipeline used to forget every sale the moment it closed: a sold property drops off the
      # next scrape and takes its case number with it. On 2026-08-04 that left 15 recoverable cases
      # out of an entire summer of Miami-Dade auctions.
      # auction_archive.py appends every sale we see (append-only, a few hundred KB/yr) so the case
      # numbers survive. cash_buyers.py then reads back the ones whose sale is >21 days old — the
      # observed lag before a certificate of title issues (Martin condo: sale 05/27 -> cert 06/16) —
      # and records the third-party bidder named on it.
      # Net effect: the proven-cash-buyer list accumulates on its own, every night, with no operator
      # action. It yields nothing for the first three weeks by design, then compounds.
      # Order matters: snapshot AFTER the rebuild so the archive captures the enriched board.
      - name: '[4b/5] Archive the auction calendar + harvest cert-of-title buyers'
        continue-on-error: true
        run: |
          python auction_archive.py
          python cash_buyers.py --days 120 --limit 60

      # ---- [5/5] Publish final ------------------------------------------------------------
      - name: '[5/5] Publish final docs/index.html'
        run: |
          # PUBLISH GUARD. The runner cannot regenerate most enrichment — no 2Captcha key (MD lien
          # chains run --cached-only) and the BatchData balance is exhausted (no skip-trace phones,
          # no PB liens). With a cold restore cache it therefore builds a CORRECT but GUTTED board
          # and used to publish it straight over the enrichment-rich local build. Measured on real
          # commits: local ships ~3.6MB, the CI builds that overwrote it shipped 2.7MB and 1.5MB —
          # the daily run was quietly stripping lien chains and phone numbers off the live site.
          # A green workflow that degrades the product is worse than a red one that does nothing.
          if ! python publish_guard.py; then
            echo "::warning::Publish SKIPPED — this build would strip enrichment from the live board. Site left untouched."
            echo "### ⚠ Publish skipped — enrichment regression" >> $GITHUB_STEP_SUMMARY
            echo "The runner built a board with materially less lien/phone data than what is already live, so the publish was blocked and the site was left as-is. See the publish-guard output in the log." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          # docs/img/ also picks up new photos this run — stage them too. sale_history_cache.json
          # is committed as well: it is the SINGLE SOURCE for stay-compliance (no actions/cache
          # copy anymore), so the daily [3e] refresh must flow back into the repo.
          git add docs/index.html docs/img sale_history_cache.json llc_officers.json judgment_dates.json auction_archive.json cash_buyers.json
          if git diff --staged --quiet; then
            echo "nothing changed — site already current"
          else
            git commit -m "refresh: auto lead + phone + photo update"
            # same race-proofing as [1b/5]: rebase-with-retry, fresh build wins conflicts
            for i in 1 2 3; do
              git pull --rebase --autostash -X theirs origin main && git push origin HEAD:main && break
              [ "$i" = 3 ] && exit 1
              sleep 10
            done
          fi

      # ---- Save pipeline state BEFORE the health gate ---------------------------------------
      # This runs with `if: always()` and sits AHEAD of Health on purpose. A day of scraping —
      # lien chains, skip-traced phones, comps, geocodes, Whitepages households — is expensive and
      # in several cases IRREPLACEABLE in CI (no 2Captcha key in the cloud). It must never be thrown
      # away because a coverage report card came back red. This is the step whose absence created
      # the death spiral: the old implicit post-save was skipped on failure, so the cache froze on
      # 2026-07-21 and every run afterwards restored the same empty state.
      - name: Save pipeline state (always — even if a later step fails)
        if: always()
        # A transient cache-save hiccup must not fail the run — that is the exact shape of the bug
        # this step exists to kill. If a save is ever lost, the next run reports 'lien cache COLD'
        # as a WARN and re-seeds itself.
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            leads_final.json
            leads_raw.json
            broward_leads.json
            palmbeach_leads.json
            skiptrace_results.json
            cases_qs.json
            records_qs.json
            records_liens.json
            judgment_dates.json
            auction_archive.json
            cash_buyers.json
            broward_liens.json
            palmbeach_liens.json
            batchdata_liens.json
            county_plaintiffs.json
            lis_pendens.json
            lp_leads.json
            lp_addresses.json
            _lp_pagis_cache.json
            _lp_values_cache.json
            _lp_status_cache.json
            _code_liens_cache.json
            code_liens.json
            _county_taxes_cache.json
            county_taxes.json
            replies.json
            whitepages_lookup.json
            geocode_cache.json
            tax_links.json
            comps.json
            property_types_cache.json
            listing_status_cache.json
            redfin_cache.json
            health.json
            full.json
          key: dealflow-state-v11-${{ github.run_id }}

      # ---- Health ------------------------------------------------------------------------
      # healthcheck.py exits non-zero on any FAIL — that fails this step, which fails the
      # workflow, which fires GitHub's built-in workflow-failure email to the repo owner.
      # No Twilio / SMS wiring needed; the notification path is already there for free.
      # Runs AFTER the cache save so a red report can never cost us the day's data again.
      - name: 'Health'
        run: python healthcheck.py

      # Always-on run summary (visible in the Actions UI without opening logs)
      - name: Run summary
        if: always()
        run: |
          echo "### DEALFLOW refresh summary" >> $GITHUB_STEP_SUMMARY
          python -c "import json,os; load=lambda fn: (json.load(open(fn,encoding='utf-8')) if os.path.exists(fn) else []); md=load('leads_final.json'); bw=load('broward_leads.json'); pb=load('palmbeach_leads.json'); st=load('skiptrace_results.json'); st=st if isinstance(st,dict) else {}; ph=sum(1 for v in st.values() if isinstance(v,dict) and v.get('phones')); kb=os.path.getsize('docs/index.html')//1024 if os.path.exists('docs/index.html') else 0; print(f'- Miami-Dade **{len(md)}** - Broward **{len(bw)}** - Palm Beach **{len(pb)}**'); print(f'- Owners with phones **{ph}**'); print(f'- docs/index.html **{kb} KB**')" >> $GITHUB_STEP_SUMMARY
          echo "- Red run = email alert (Actions notifications). Green runs need no attention." >> $GITHUB_STEP_SUMMARY
