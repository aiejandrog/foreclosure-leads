name: DEALFLOW Daily Refresh

# TRIMMED 2026-09-16 to the ONE artifact the cloud actually delivers: the hard-money balloon book.
#
# Why. The desktop is the sole DealFlow runner (refresh-dealflow.bat, "\DEALFLOW Refresh" 5:30 AM) and
# runs every board step this workflow used to run. In the cloud those steps were pure cost: ~95 min
# a day (~2,840 Actions minutes / 30 days) building a board that publish_guard blocked EVERY day for
# thin enrichment (no board commit from this workflow in 30 days), while the balloon book, the only
# output that reached main, took under 30 seconds. The repo is going private, where Actions minutes
# are metered (GitHub Pro includes 3,000/month), so the dead weight had to go.
#
# What stays here and why:
#  * [4c/5] balloon book (fl_lp/broward_mortgages.py -> hardmoney_enrich -> hardmoney_values ->
#    hardmoney_balloon) - hardmoney_enrich/values/balloon run NOWHERE else.
#  * the state cache - hardmoney_values.json + hardmoney_enriched.json + llc_officers.json are
#    gitignored PII caches whose ONLY persistence is actions/cache. The restore/save PATH LISTS
#    ARE UNCHANGED ON PURPOSE: actions/cache derives an internal version hash from the path list,
#    and editing it orphans every existing cache (one cold run, every Sunbiz human re-fetched).
#    Unused paths are simply re-saved as restored, which also keeps the old full pipeline's
#    state warm if it is ever restored.
#
# What moved nowhere (already on the desktop): MD/BW/PB scrapes, liens, comps, taxes, photos,
# lis pendens chain, skip-trace, replies.py + optout_sync.py (run-replies-daily.bat, 7:00 AM),
# auction archive + cash buyers, sale history, judgment dates, healthcheck, board publish.
# The full pipeline definition is in git history (the commit before this trim) if it is ever needed.

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: dealflow-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # The balloon chain measured < 1 min; the budget covers a slow Sunbiz/BCPA night and a cold cache.
    timeout-minutes: 30
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'

    steps:
      - name: Checkout (with push token)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # No Playwright browser install: the balloon chain is plain HTTP (requests / curl).
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # RESTORE ONLY; the save is the always() step at the end. PATH LIST MUST STAY IDENTICAL to the
      # save step and to every earlier v14 cache (see the header).
      - name: Restore pipeline state (balloon caches + the rest, unchanged)
        id: statecache
        uses: actions/cache/restore@v4
        with:
          path: |
            leads_final.json
            leads_raw.json
            broward_leads.json
            palmbeach_leads.json
            skiptrace_results.json
            cases_qs.json
            records_qs.json
            records_liens.json
            judgment_dates.json
            auction_archive.json
            cash_buyers.json
            broward_liens.json
            palmbeach_liens.json
            county_plaintiffs.json
            lis_pendens.json
            lp_leads.json
            lp_addresses.json
            _lp_pagis_cache.json
            _lp_values_cache.json
            _lp_status_cache.json
            _code_liens_cache.json
            code_liens.json
            _county_taxes_cache.json
            county_taxes.json
            replies.json
            whitepages_lookup.json
            geocode_cache.json
            tax_links.json
            comps.json
            property_types_cache.json
            listing_status_cache.json
            redfin_cache.json
            hardmoney_values.json
            hardmoney_enriched.json
            llc_officers.json
            health.json
            full.json
          key: dealflow-state-v14-${{ github.run_id }}
          restore-keys: dealflow-state-v14-

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # ---- [4c/5] Hard-money balloon book (Jesse's refi play) ---------------------------------
      # Jesse's son funds DSCR refis (70-80 LTV, 6-8%, 30yr fixed). This chain finds Broward
      # investors sitting on 10-12% hard-money paper with a 1-2 year balloon coming due, prices
      # each one against the county roll, and publishes only the ones that fit his box.
      #  * sweep --months 2 --- nightly only needs NEW recordings; the sweeper MERGES rather than
      #    replaces, so a short window never truncates history.
      #  * enrich --limit 120 - Sunbiz + BCPA are free but rate-limited (~0.7s/LLC); chips away nightly.
      #  * values ------------- free ArcGIS, cached per folio in hardmoney_values.json.
      # Only the redacted docs/ copy is ever staged: hardmoney_values.json / hardmoney_enriched.json
      # join parcel values to named LLC borrowers and ride the actions/cache. Never name them in
      # `git add` (naming an ignored file force-adds it).
      - name: '[4c/5] Hard-money balloon book (sweep -> enrich -> price -> publish)'
        continue-on-error: true
        run: |
          set +e
          python fl_lp/broward_mortgages.py --months 2
          python hardmoney_enrich.py --limit 120
          python hardmoney_values.py
          python hardmoney_balloon.py --months 30
          git add docs/hm-balloon-q7v3n8
          if git diff --staged --quiet; then
            echo "hard-money book unchanged"
          else
            git commit -m "refresh: hard-money balloon book (auto)"
            for i in 1 2 3; do
              git pull --rebase --autostash -X theirs origin main && git push origin HEAD:main && break
              [ "$i" = 3 ] && break
              sleep 10
            done
          fi
          python -c "import hardmoney_values as HV; r=HV.priced(zone_only=True); f=[x for x in r if x['fits']]; v=sum(x['amt'] for x in f); print('::notice::hard-money book: %d of %d zone loans fit the DSCR box (\$%.1fM)'%(len(f),len(r),v/1e6))"
          exit 0

      # Save even on failure: the balloon caches are irreplaceable in CI (see the header). A lost save
      # just means one slower night, so a hiccup here must not fail the run.
      - name: Save pipeline state (always)
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            leads_final.json
            leads_raw.json
            broward_leads.json
            palmbeach_leads.json
            skiptrace_results.json
            cases_qs.json
            records_qs.json
            records_liens.json
            judgment_dates.json
            auction_archive.json
            cash_buyers.json
            broward_liens.json
            palmbeach_liens.json
            county_plaintiffs.json
            lis_pendens.json
            lp_leads.json
            lp_addresses.json
            _lp_pagis_cache.json
            _lp_values_cache.json
            _lp_status_cache.json
            _code_liens_cache.json
            code_liens.json
            _county_taxes_cache.json
            county_taxes.json
            replies.json
            whitepages_lookup.json
            geocode_cache.json
            tax_links.json
            comps.json
            property_types_cache.json
            listing_status_cache.json
            redfin_cache.json
            hardmoney_values.json
            hardmoney_enriched.json
            llc_officers.json
            health.json
            full.json
          key: dealflow-state-v14-${{ github.run_id }}

      - name: Run summary
        if: always()
        run: |
          echo "### DEALFLOW cloud run (balloon book only)" >> $GITHUB_STEP_SUMMARY
          echo "- Board, call pages, liens, phones and replies run on the desktop (refresh-dealflow.bat, run-replies-daily.bat)." >> $GITHUB_STEP_SUMMARY
          echo "- Balloon caches restored: ${{ steps.statecache.outputs.cache-matched-key || 'COLD (no prior cache)' }}" >> $GITHUB_STEP_SUMMARY
