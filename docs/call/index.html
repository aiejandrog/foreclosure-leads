<!doctype html><html lang="en"><head>
<!--SIG="1a6ee4b91ce6" — build signature, FIRST so the stale-cache check can find it in one small range
    request. It also lives in the script below; this copy exists because that one sits at byte
    ~252,000, after the encrypted payload on the same line, while freshCheck asks for bytes 0-1200.
    The check therefore matched nothing and silently never fired: a phone serving last week's list
    looked identical to one serving today's. Keep this marker above the payload, always. -->
<meta charset="utf-8">
<!-- THE viewport meta. Its absence is the single reason the morning worker is unusable on a phone. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Call Mode</title>
<style>
:root{--bg:#0b1730;--card:#132244;--ink:#f4f7ff;--mut:#94a7c8;--gold:#c6a14b;--ok:#2e7d32;--bad:#b3261e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,system-ui,sans-serif;
     padding:0 0 env(safe-area-inset-bottom)}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 40px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.lane{display:flex;gap:6px}
.lane button{flex:1;min-height:44px;border-radius:10px;border:1px solid #2a3f6b;background:#0f1d3a;
     color:var(--mut);font-size:14px;font-weight:600}
.lane button.on{background:var(--gold);color:#0b1730;border-color:var(--gold)}
.card{background:var(--card);border:1px solid #2a3f6b;border-radius:14px;padding:16px;margin-top:12px}
.addr{font-size:22px;font-weight:700;line-height:1.2}
.own{font-size:15px;color:var(--mut);margin-top:2px}
.when{margin-top:8px;font-size:15px;color:var(--gold);font-weight:600}
.facts{margin-top:10px;font-size:13px;color:var(--mut)}
a.dial,button.big{display:block;width:100%;min-height:58px;margin-top:12px;border-radius:12px;
     border:0;font-size:19px;font-weight:700;text-align:center;line-height:58px;text-decoration:none;
     touch-action:manipulation}
a.dial{background:var(--ok);color:#fff}
/* Redial: same tel: mechanics as the main dial button, styled as the secondary action it is —
   outlined, not filled, so the outcome buttons stay the visual priority on the screen. */
a.redial{display:block;width:100%;min-height:50px;line-height:50px;margin-top:10px;border-radius:12px;
     border:1px solid var(--ok);color:var(--ok);background:transparent;font-size:16px;font-weight:700;
     text-align:center;text-decoration:none;touch-action:manipulation}
button.big{background:#1d4ed8;color:#fff}
.oc button{display:block;width:100%;min-height:56px;margin-top:9px;border-radius:12px;border:1px solid #2a3f6b;
     background:#0f1d3a;color:var(--ink);font-size:17px;font-weight:600;touch-action:manipulation}
.oc button.warn{border-color:#7a4a12;color:#f0b357}
.oc button.dnc{border-color:var(--bad);color:#ff8a80}
/* After-call panel. Every control here is >=48px because it is tapped one-handed, often walking. */
.afterlab{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--gold);margin:16px 0 7px}
#tx,#txy,#txn,#nx,#vmdone{display:block;width:100%;min-height:52px;border-radius:12px;border:1px solid #2a3f6b;
     background:#1d4ed8;color:#fff;font-size:17px;font-weight:700;margin-top:8px;touch-action:manipulation}
#tx.ghost,#txn.ghost{background:#0f1d3a;color:var(--ink)}
#nx{background:#0f1d3a;color:var(--ink)}
.cbrow{display:flex;gap:8px}
.cb{flex:1;min-height:50px;border-radius:12px;border:1px solid #2a3f6b;background:#0f1d3a;
     color:var(--ink);font-size:14px;font-weight:600;touch-action:manipulation}
.cb.on{border-color:var(--ok);color:var(--ok)}
.cb:disabled{opacity:.45}
/* THE FILE — the reference block on the outcome screen, up for the whole call */
.refbox{margin-top:12px;padding:11px 13px;border-radius:11px;background:#0f1d3a;border:1px solid #2a3f6b}
.reft{width:100%;border-collapse:collapse;font-size:13px;line-height:1.5}
.reft td{padding:2.5px 0;vertical-align:top;-webkit-user-select:text;user-select:text}
.reft td.rk{color:var(--mut);font:700 10.5px "Segoe UI",Arial,sans-serif;letter-spacing:.06em;
  text-transform:uppercase;white-space:nowrap;padding-right:10px;width:96px}
/* HIS FILE — research links, thumb-sized so they are usable one-handed on a call */
.flinks{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.flinks a{display:inline-flex;align-items:center;min-height:44px;padding:10px 14px;border-radius:10px;
  background:#12213f;border:1px solid #2a3f6b;color:var(--ink);font-size:13.5px;font-weight:600;
  text-decoration:none;touch-action:manipulation;-webkit-tap-highlight-color:rgba(198,161,75,.25)}
.flinks a:active{background:#1b2c50}
.fcase{margin-top:8px;color:var(--mut);font-size:11.5px;-webkit-user-select:text;user-select:text}
/* THE CALL LOG (registry) */
.regsum{font-size:15px;color:var(--ink)}
.regsum b{color:var(--gold);font-size:19px}
.reglist{margin-top:12px;max-height:62vh;overflow:auto}
.regrow{padding:11px 2px;border-bottom:1px solid #1c2b4d}
.regtop{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-size:15px}
.regago{color:var(--mut);font-size:12.5px;white-space:nowrap}
.regsub{color:var(--mut);font-size:12.5px;line-height:1.5;margin-top:2px}
.regby{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:999px;
  background:#1c2b4d;color:var(--ink);font:700 10.5px "Segoe UI",Arial,sans-serif}
.txconf{font-size:14px;color:var(--gold);font-weight:600;margin-top:10px}
/* THE OUTPUT — the exact text that went to the composer, shown back so he can see what was sent
   (and read it aloud on the follow-up call). Selectable so he can copy it into another app. */
.txbody{margin-top:8px;padding:11px 13px;border-radius:10px;background:#0f1d3a;border:1px solid #2a3f6b;
  color:var(--ink);font-size:13.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word;
  -webkit-user-select:text;user-select:text;max-height:220px;overflow:auto}
.txbody .lbl{display:block;font:800 10px "Segoe UI",Arial,sans-serif;letter-spacing:.1em;
  text-transform:uppercase;color:var(--mut);margin-bottom:5px}
#txr{background:#3d2c08;border-color:#A8720C;color:#F6E9C8}
.supn{font-size:11px;color:var(--mut);text-align:center;padding:5px 8px 0}
/* language chips: small but still thumb-safe; .on = the active language */
.lchips{display:inline-flex;gap:4px;margin-left:8px;vertical-align:middle}
.lchip{min-width:44px;min-height:30px;padding:2px 8px;border-radius:8px;border:1px solid #2a3f6b;
     background:#0f1d3a;color:var(--mut);font-size:12px;font-weight:800;touch-action:manipulation}
.lchip.on{border-color:var(--gold);color:var(--gold)}
.errchip{color:#ff8a80;font-weight:700;cursor:pointer;text-decoration:underline}
.sub{font-size:12px;color:var(--mut);margin-top:6px;text-align:center}
.vm{background:#0f1d3a;border:1px solid #2a3f6b;border-radius:10px;padding:12px;margin-top:10px;font-size:17px;line-height:1.5}
.vmlang{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--gold);margin:12px 0 3px}
/* z-60 — above the sheet (40), the #sync chip (45) and the pill (50). With no z-index the sheet
   painted over every toast: the one piece of feedback confirming an outcome was logged was
   invisible on exactly the screens where he needed it.
   pointer-events:none — a bottom-fixed z-60 overlay that CATCHES taps steals the bottom strip of
   the next screen for 1.4s after every logged outcome. Feedback must never eat input. */
.toast{position:fixed;left:0;right:0;bottom:0;z-index:60;pointer-events:none;background:var(--ok);color:#fff;padding:16px;
     font-weight:700;text-align:center;transform:translateY(100%);transition:transform .18s}
.toast.on{transform:none}
.gate{padding:28px 18px;max-width:420px;margin:0 auto}
.gate input{width:100%;min-height:52px;font-size:17px;padding:0 12px;border-radius:10px;border:1px solid #2a3f6b;
     background:#0f1d3a;color:var(--ink)}
/* z-index 50 — ABOVE the sheet's 40. Both are position:fixed at the bottom, and with no z-index at
   all the pill sat below the sheet in paint order, so the sheet covered it and swallowed the tap.
   The sheet is always in the DOM, so "a newer list is ready" was permanently unreachable: the one
   control whose entire job is to rescue him from a stale list could never be pressed.
   It sits above the safe-area inset too, so it clears the sheet's grip rather than hiding behind it. */
.pill{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:50;
     background:var(--gold);color:#0b1730;border-radius:12px;box-shadow:0 4px 18px rgba(0,0,0,.5);
     min-height:52px;padding:14px;font-weight:700;text-align:center;display:none}
.mut{color:var(--mut)}
/* ---- the four bands. "Everything on the card" is a hierarchy problem, not an omission problem:
   at 390px the essentials must read without a scroll, so type size carries the ranking. ---- */
.band{border-top:1px solid #22355e;margin-top:12px;padding-top:10px}
.band:first-of-type{border-top:0;margin-top:0;padding-top:0}
.blab{font-size:10px;font-weight:800;letter-spacing:.09em;color:var(--mut);margin-bottom:5px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.kv .k{font-size:11px;color:var(--mut);line-height:1.2}
.kv .v{font-size:17px;font-weight:700;line-height:1.25}
.kv .v.sm{font-size:14px;font-weight:600}
/* NOT CHECKED is a first-class state, never a blank and never a $0 — payoff is missing on 54% of
   leads and a zero there reads as "they owe nothing", which is the opposite of the truth. */
.nc{color:#6b7fa8;font-style:italic;font-weight:600;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{font-size:11px;font-weight:700;padding:4px 8px;border-radius:999px;border:1px solid #2a3f6b;color:var(--mut)}
.chip.hot{border-color:var(--gold);color:var(--gold)}
.chip.bad{border-color:var(--bad);color:#ff8a80}
.chip.ok{border-color:#2e7d32;color:#7fd18a}
.warnbar{background:#3a2a12;border:1px solid #7a4a12;color:#f0b357;border-radius:9px;padding:9px 11px;
  font-size:13px;font-weight:600;margin-top:10px;line-height:1.35}
.hist{font-size:12px;color:var(--mut);margin-top:8px;line-height:1.5}
/* ---- script bottom sheet ---- */
.sheet{position:fixed;left:0;right:0;bottom:0;background:#0f1d3a;border-top:1px solid var(--gold);
  border-radius:14px 14px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.45);z-index:40;
  transition:transform .2s ease;padding-bottom:env(safe-area-inset-bottom)}
.sheet .grip{height:46px;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation}
.sheet .grip i{display:block;width:42px;height:4px;border-radius:99px;background:#3a5286}
.sheet .peek{padding:0 16px 12px;font-size:14px;line-height:1.4}
.sheet .body{display:none;padding:0 16px 18px;max-height:58vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet.open .body{display:block}
/* SHORT VIEWPORTS — phone held sideways, or portrait with the keyboard up. At 375px tall a 58vh body
   plus grip plus peek measured 319 of 375px: the sheet stops being an overlay and becomes the whole
   screen, and the promise that the lead's numbers stay visible behind it quietly stops being true.
   Only 30px of card survived. Shrinking the body costs nothing — it already scrolls (997px of content
   in a 218px window), so this changes how much you see at once, never how much you can reach. */
@media (max-height:560px){
  .sheet .body{max-height:42vh}
  .sheet .peek{font-size:13px;padding-bottom:9px}
}
.say{background:#132244;border-left:3px solid var(--gold);border-radius:0 8px 8px 0;padding:11px 12px;
  margin:8px 0;font-size:16px;line-height:1.5}
.say.es{border-left-color:#3a5286;color:#cddcf5}
.ltag{font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--gold);margin-top:10px}
.ltag.es{color:#8fa9d8}
.cioc{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:10px 0}
.cioc button{min-height:44px;border-radius:8px;border:1px solid #2a3f6b;background:#132244;color:var(--mut);
  font-size:11px;font-weight:800;letter-spacing:.04em}
.cioc button.on{background:var(--gold);color:#0b1730;border-color:var(--gold)}
.objs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.objs button{min-height:44px;padding:0 11px;border-radius:999px;border:1px solid #2a3f6b;background:#132244;
  color:var(--ink);font-size:13px;font-weight:600}
.objs button.on{background:var(--gold);color:#0b1730;border-color:var(--gold)}
.never{background:#3a1512;border:1px solid var(--bad);color:#ff9d94;border-radius:9px;padding:9px 11px;
  font-size:12px;line-height:1.45;margin-top:12px}
.noes{font-size:12px;color:#8fa9d8;font-style:italic;margin-top:6px}
/* Clearance for the fixed bottom sheet, sized to the MEASURED collapsed height, not the guessed
   one: 1px border + 46px grip + ~75px of wrapped peek + safe-area inset ≈ 122-156px. It was 76px —
   and only on the lead screen — so the last button of every other screen sat under the sheet and a
   tap opened the script instead. Every #app paint appends this now. */
.sheetpad{height:calc(130px + env(safe-area-inset-bottom))}
/* Logging screens hide the sheet entirely (screenOutcome / afterCall add .hid; screenLead removes
   it). The script belongs to the CALL; while logging, the sheet was only a tap-thief. */
.sheet.hid{display:none}
</style></head><body>
<div id="app" class="wrap"><div class="gate"><h2>Call Mode</h2>
<p class="mut" id="gmsg">Enter your access code.</p>
<input id="code" type="password" inputmode="text" autocomplete="one-time-code" placeholder="DEALFLOW-XXXXXXXX">
<button class="big" id="go">Unlock</button></div></div>
<div class="toast" id="toast"></div>
<!-- z-index 45: above the sheet (40), below the pill (50). This line carries "logged to this phone
     only — team sync is off", which matters exactly when he is working the queue with the sheet up;
     in normal flow the open sheet covered it and the warning was unreadable at the moment it applied. -->
<div class="sub" id="sync" style="position:relative;z-index:45;padding:6px 14px;margin:0 10px 10px;
     background:var(--bg);border-radius:8px"></div>
<div class="pill" id="pill">A newer list is ready. Tap to load.</div>
<!-- Script sheet. Lives OUTSIDE #app so re-rendering a lead never tears it down mid-sentence —
     the operator can be reading the opener while the card behind it advances. -->
<div class="sheet" id="sheet"><div class="grip" id="grip"><i></i></div>
<div class="peek" id="peek"></div><div class="body" id="sbody"></div></div>

/* ---- gate: same code, same envelope as the board. fcPw is SHARED (same origin) so a phone that
   already unlocked the board never sees this screen. ---- */
/* Envelope must match foreclosure_leads._encrypt_multi EXACTLY:
     {enc:2, it, iv, ct, keys:[{salt, iv, ct}]}
   One random master key encrypts the payload once; that master key is then wrapped under each
   person's code. The wrapped blob is NOT raw key bytes — it is JSON {mk:<base64>, name:<label>},
   so it must be parsed and the mk base64-decoded before it can be imported.
   ⚠️ Codes written in site.codes as `Label = CODE | PHRASE` wrap under CODE + \x1f + PHRASE. This
   single-field gate therefore opens individual codes only; a phrase-protected team code has to be
   entered on the board first (which shares fcPw with this page anyway). */
async function unwrap(code){
  var te=new TextEncoder();
  var km=await crypto.subtle.importKey('raw',te.encode(code),'PBKDF2',false,['deriveKey']);
  var keys=ENC.keys||[];
  for(var n=0;n<keys.length;n++){
    var w=keys[n];
    try{
      var wk=await crypto.subtle.deriveKey(
        {name:'PBKDF2',salt:b2u(w.salt),iterations:ENC.it||200000,hash:'SHA-256'},
        km,{name:'AES-GCM',length:256},false,['decrypt']);
      var blob=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2u(w.iv)},wk,b2u(w.ct));
      var meta=JSON.parse(new TextDecoder().decode(blob));      // {mk, name}
      /* WHO IS CALLING. Each teammate has their OWN access code, and the code's blob carries their
         name — so the page already knows whether this is Alejandro, Jose or Carlos without asking.
         Stamped onto every call/text this device logs, which is what makes the shared registry
         able to say "Carlos called this one 2h ago" instead of an anonymous timestamp. */
      try{ if(meta.name) localStorage.setItem('fcCaller', meta.name); }catch(e){}
      var mk=await crypto.subtle.importKey('raw',b2u(meta.mk),{name:'AES-GCM'},false,['decrypt']);
      var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2u(ENC.iv)},mk,b2u(ENC.ct));
      return JSON.parse(new TextDecoder().decode(pt));
    }catch(e){}
  }

}
function b2u(b64){var s=atob(b64),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}

async function boot(){

/* CLIENT-SIDE SUPPRESSION — the read-back the first version was missing.
   Build-time filtering catches opt-outs and stays that existed when the page was BUILT. Everything
   decided since then lives only in notes: a wrong-number logged this morning, a DNC a teammate
   synced an hour ago, a person-level opt-out keyed to an email or phone. Without reading these back,
   the page happily re-serves a lead somebody already disproved — which is how a stranger gets called
   twice and how an opt-out gets violated by the device that recorded it. */
/* Digits of every phone recorded as opted out under a '#number' note key rather than a case.
   The board writes these (optout_sync.py, the STOP-reply loop) and they match no case on their own,
   so without this lookup they suppress nothing at all.

   Deliberately NOT memoized on the notes object's identity, the way the board memoizes
   _optedOutIdentities: mergeNotes assigns `notes[caseId] = merged` IN PLACE, so the object is
   identical after a teammate syncs an opt-out and an identity memo would never invalidate. A stale
   index here means the phone keeps dialing someone who just opted out — precisely what it exists to
   prevent. pool() rebuilds it on every call instead; that is O(notes) once, not per row. */
var _OPTPH = null;
function optPhones(force){
  if(_OPTPH && !force) return _OPTPH;
  var s = {};
  for(var k in notes){
    if(k.charAt(0) !== '#') continue;
    var nn = notes[k] || {};
    if(nn.optout || nn.status === 'DO NOT CONTACT') s[k.slice(1).replace(/\D/g,'')] = 1;
  }

/* Who is on this phone — set from the access-code blob at unlock (each teammate has their own

function caller(){

/* THE SHARED REGISTRY, read side. Newest CALL touch on this lead from ANY device, with who made
   it. Team sync merges teammates' notes into the same store, so this sees Carlos's dials too. */
function lastCall(n){
  var best = null;
  ((n && n.touches) || []).forEach(function(t){
    if((t.ch||'') !== 'call') return;
    var ts = +t.tsu || +new Date(t.ts || t.d || 0) || 0;
    if(!ts) return;
    if(!best || ts > best.ts) best = {ts: ts, out: t.out || '', by: t.by || ''};
  });
  ((n && n.dials) || []).forEach(function(d){
    var ts = +d.tsu || 0;
    if(ts && (!best || ts > best.ts)) best = {ts: ts, out: d.oc || '', by: d.by || ''};
  });

}
function agoTxt(ms){
  var m = Math.max(0, Math.round((Date.now() - ms) / 60000));
  if(m < 60) return m + 'm ago';
  var h = Math.round(m / 60);
  if(h < 36) return h + 'h ago';
  return Math.round(h / 24) + 'd ago';
}
function suppressed(r){
  var n = notes[r.c] || {};

  if(n.optout || n.status === 'DO NOT CONTACT') return 'opted out';
  if(n.status === 'Dead') return 'dead';
  var ph = optPhones(), p = r.p || [];
  for(var j=0;j<p.length;j++) if(ph[p[j]]) return 'this number opted out';
  /* ALREADY WORKED — by me OR by a teammate. Without this, Carlos logs a call, the note syncs to
     this phone, and the lead still sits in the queue waiting to be dialled a second time by the
     other guy. The cooldown is the SAME outcome-aware one the board honours (logOutcome writes
     n.cooldownH: no-answer comes back tomorrow, a real conversation waits longer), so the two
     surfaces can never disagree about whether a lead is due. */
  var lc = lastCall(n);
  if(lc){
    var coolH = (typeof n.cooldownH === 'number' && n.cooldownH >= 0) ? n.cooldownH : 24;

/* Do-Not-Text is text-only and must NOT hide a lead from CALLING — but a number on it should not be

function dntSet(){

/* pool() is the ONE place suppression is evaluated. Everything else reads what it left behind.

   Two reasons this is not just tidiness. First, `suppressed()` depends on the opt-out phone index,
   which must be rebuilt from live notes — a caller that skipped the rebuild would silently judge a
   lead against a stale index and keep dialing someone who just opted out. Second, head() used to run
   its own full pass over ROWS to count hidden leads, doubling the per-paint cost for a number pool()
   already knew. Both problems disappear if there is exactly one evaluator. */
var _SUPN = 0;
/* Case ids that got at least one logged outcome this session. Deduped, because a lead dialled on
   three numbers is one lead worked, not three. */
var _WORKED = [];
function pool(){

     screenOutcome() both call pool() outside a render, and a teammate's opt-out landing between
     paints would otherwise be missed. 0.05ms for 900 note keys; the O(rows x notes) version this
     replaced measured 36.8ms per pass at 400 rows, twice per paint. */
  optPhones(true);

  if(lane==='wq'){ var s={}; workerQ().forEach(function(c){ s[c]=1; }); base = ROWS.filter(function(r){ return s[r.c]; }); }
  else base = ROWS.filter(function(r){ return lane==='soon' ? !r.lp : !!r.lp; });

function start(){

  var _wq = workerQ();
  if(_wq.length && ROWS.some(function(r){ return _wq.indexOf(r.c) >= 0; })) lane = 'wq';
  i=0; render(); freshCheck();

  if(!k){ $('sync').textContent='Team sync is off — outcomes log to this phone only. Turn it on in the board to reach the laptop.'; }

}

/* ADVANCE BY IDENTITY, NEVER BY `i++`.

   outcome can REMOVE the current lead from it — do-not-contact, wrong number and not-interested all
   become suppressed the moment they are written, and a worker-queue entry is retired on any outcome.
   When that happens the successor slides down into slot `i`, so `i++` lands one past them and a
   real person is silently skipped. (Suppression is new; this is a regression it introduced, and the
   worker lane had the same hole before it.)

function advance(workedC, nextC){

  for(k=0;k<P.length;k++) if(P[k].c===workedC){ i=k+1; return render(); }
  render();
}
/* WHICH SCREEN IS UP. The board's extracted mergeNotes ends with `render()` — harmless on the
   board, where render repaints a static list, and CATASTROPHIC here, where the page is a wizard.
   Returning from the tel: dialer or sms: composer fires visibilitychange -> syncPull -> mergeNotes
   -> render(), which replaced the outcome screen / after-call panel / "did it send?" confirm 1-2s
   after he got back, and reset phIdx to 0. That is why the FIRST call of a session worked (nothing
   to merge yet) and everything after it "went faulty": his own first push guaranteed every later
   return had a change to merge. The data must land; the REPAINT must wait. */
var SCREEN='lead';

     same words. Work every lead and the pool drains to zero, so a finished session was reporting

     the fail-silent one on the auction horizon: an empty result must never look like missing data. */

      ? '<b>Lane cleared.</b><div class="sub">'+_WORKED.length+' lead'+(_WORKED.length===1?'':'s')+' worked. Switch lanes above, or reopen tomorrow.</div>'

/* ===== THE CALL REGISTRY =========================================================================

    var out = [], p = 0;
    for(var i = 0; i < groups.length && p < s.length; i++){ out.push(s.substr(p, groups[i])); p += groups[i]; }
    if(p < s.length) out.push(s.substr(p));

/* ---- text ladder, person-keyed --------------------------------------------------------------
   Mirrors the board's _textStage. The cap is per HUMAN, not per case: three messages about property
   A plus three about property B is six messages to one phone. WITHIN a case we take max(local,
   ledger) because a send made in this browser is also in the next bake and summing would retire
   someone a stage early; ACROSS cases we sum, because those really are separate messages. */
var TEXT_MAX_TOTAL = 3;
/* Every case belonging to this person that this device can see.
   🔴 ROWS ALONE IS NOT ENOUGH. ROWS is the 400 DIALABLE leads of 783 qualifying, out of ~1,700 in
   the pipeline — so a person's other property, or a case whose auction already passed, is simply not
   in it. Counting texts over that subset lets a 4th message go to someone the ladder thinks is on
   their 2nd, which is the exact FTSA exposure the cap exists to prevent.
   `r.pcs` is the person's FULL case list from the build's own grouping, shipped inside the encrypted
   payload for exactly this lookup. (A previous version scanned notes for a `pkey` field instead —
   dead code: nothing ever writes pkey into a note, and the test that "proved" it passed on a
   hand-fabricated one. notes carries the TOUCHES for these cases; pcs carries WHICH cases.)
   TEXTPERSON (the server ledger) remains the authoritative backstop in textStage for cases that have
   left the pipeline entirely. */
function personCases(r){
  var k = r.pk, seen = {}, out = [];
  function add(c){ if(c && !seen[c]){ seen[c]=1; out.push(c); } }
  ROWS.forEach(function(x){ if(x.pk === k) add(x.c); });
  (r.pcs||[]).forEach(add);
  add(r.c);
  return out;
}
function textStage(r){
  var sends = 0, replied = false;
  personCases(r).forEach(function(c){
    var n = notes[c] || {}, local = 0;
    (n.touches||[]).forEach(function(t){
      if((t.ch||'') !== 'text') return;
      if(/replied|inbound|answered|said stop/i.test(t.out||'')){ replied = true; return; }
      local++;
    });
    sends += local;
  });
  var P = TEXTPERSON[r.pk] || 0;
  if(P > sends) sends = P;           // authoritative — includes cases that never shipped here
  if(replied) return 'replied';
  if(sends >= TEXT_MAX_TOTAL) return 'retired';
  return ['cold','follow','final'][sends] || 'retired';
}
/* Bodies are the board's t1/t2/t3 shapes. Compliance rides along: identify, one ask, opt-out on

   Written as TEMPLATES and run through fillScript rather than interpolated here. SENDER is an
   OBJECT — a raw `+ SENDER +` renders "this is [object Object] with Miami Solutions Group", which is

/* Callback. Writes n.next, the same field the board reads to re-surface a lead — so a promise made
   on the phone shows up on the laptop instead of living in his head. */
function setCallback(r, hours, label){
  var n = notes[r.c] = notes[r.c] || {status:'',note:''};
  var t = new Date(Date.now() + hours*3600*1000);
  /* LOCAL date parts, mirroring the board's _setNext. toISOString() is UTC, and Miami is UTC-4 —
     so any callback set between 8pm and midnight lands on TOMORROW's date, which is precisely the
     window he works. The board renders n.next as "due today"/"overdue Nd" against a local today(),
     so a UTC string is an off-by-one-day that only shows up in the evening. */
  n.next = t.getFullYear() + '-' + String(t.getMonth()+1).padStart(2,'0') + '-' + String(t.getDate()).padStart(2,'0');
  n.nextTs = t.getTime();
  /* NO SYNTHETIC TOUCH. A touch is a CONTACT record; scheduling a callback is not a contact, and the
     board has no 'note' channel anyway (call/door/email/letter/worker/text/surplus). Inventing one
     would inflate the very counts this system exists to make trustworthy — and `_lastTouchD` uses
     the last touch to break merge ties, so a fake one would let a reminder outrank a real outcome.
     The board itself sets follow-ups this way: _setNext writes n.next and pushes nothing.
     The human-readable trace goes in n.note, which is free text and is what n.note is for. */
  var line = today() + ' callback set ' + label;
  n.note = n.note ? (n.note.indexOf(line) >= 0 ? n.note : (n.note + '\n' + line)) : line;
  saveNotes(); queueSync();
  toast('Callback ' + label);
}

    // device. Union only — a suppression list may only ever grow.

  // opt-out suppresses only cases we happen to know about today.
  (r.p||[]).forEach(function(p){

    n.optout = n.optout || stamp;
    n.status = 'DO NOT CONTACT';

/* Mirrors tracker_template.html's `callout` dispatcher so the phone and the laptop write the SAME

function logOutcome(r,o,digits){
  var n=notes[r.c]=notes[r.c]||{status:'',note:''};

     silently collapsing the second identical tap while stamping "✓ logged" read as a broken

  // `by` = who made this call (from their access code). It is what lets the other phone say
  // "called 2h ago by Carlos" instead of skipping a lead for no visible reason.
  if(fresh)
    n.touches.push({d:today(),ts:nowTS(),tsu:Date.now(),ch:'call',out:o.t,by:caller()});
  n.dials=n.dials||[];
  n.dials.push({d:today(),ts:nowTS(),tsu:Date.now(),ph4:String(digits).slice(-4),oc:o.k,by:caller()});

var SCRIPT={"op": {"en": "Hi, is this {first}? My name is {sender}. I am not selling anything and I am not calling to buy your house. There is a court case with your address on it, and I am probably the only person calling you this week who is NOT trying to take the property. Two minutes, then I will get out of your hair. Fair?", "es": "Hola, ¿hablo con {first}? Mi nombre es {sender}. No le vengo a vender nada, ni a comprarle la casa. Hay un caso en la corte con su dirección, y posiblemente soy el único que le llama esta semana que NO anda detrás de la propiedad. Dos minutos y lo dejo tranquilo. ¿Le parece?", "aen": "Hi, am I speaking with the owner of {st1}? My name is {sender}. I am not selling anything and I am not calling to buy your house. There is a court case with your address on it, and I am probably the only person calling you this week who is NOT trying to take the property. Two minutes, then I will get out of your hair. Fair?", "aes": "Hola, ¿hablo con el dueño de {st1}? Mi nombre es {sender}. No le vengo a vender nada, ni a comprarle la casa. Hay un caso en la corte con su dirección, y posiblemente soy el único que le llama esta semana que NO anda detrás de la propiedad. Dos minutos y lo dejo tranquilo. ¿Le parece?"}, "cioc": [{"k": "CUSHION", "w": "Agree, normalize, include them in the majority. Never argue — and never make them feel stupid for the plan they already have (the mod, the lawyer, the realtor, the check).", "s": "I can understand that — the majority of people we speak to feel exactly the same way. Everybody hits that wall at some point, and that's fair."}, {"k": "ISOLATE", "w": "Make the objection the ONLY thing in the way. Force open-or-closed. The 8/17 scalpel: ask what they TRULY want — the answer tells you which program to pitch.", "s": "What is it that you truly want to do with this property?  ·  If talking to me couldn't interfere with your plan at all, is there any other reason not to spend ten minutes?"}, {"k": "OVERCOME", "w": "One reframe + one analogy + one what-if. Not three. ONE. When they have a plan they believe in: INSURE the hope, never fight it — you are the parachute, not the enemy.", "s": "I don't want to be your bank or your middleman — I want to be your parachute. You're betting your house on the timing; keep your plan, and let us work on postponing the sale in parallel. If it works, I did you a favor and you owe me one."}, {"k": "CLOSE", "w": "Fairness micro-agreements, then MEASURE what they DID, not what they said: the paperwork trial close, the read-back test, the five-minute advisor handoff.", "s": "That's fair, right?  ·  'Let me get the paperwork together — if we agree we shake hands, if not I wasted fifteen minutes and we part friends.'  ·  'Save my number right now… now read it all back to me.' Clean read-back = in; 'pen ran out of ink' = don't count the deal."}], "f15": "Totally understand. One thing and I am gone: our senior advisor — over 30 years in mortgages and foreclosure workouts — reviews your case free, five minutes, on the phone. If nothing fits, we part friends. Fair?", "mars": "Before we start, a few things I am required to tell you: Miami Solutions Group is not associated with the government, and our service is not approved by the government or by your lender. Even if you use our service, your lender may not agree to change your loan. You may stop doing business with us at any time. This consultation is free, and you will never be asked to pay us a fee before you get results.", "never": ["Any promised outcome or date. \"Options,\" never \"we will save your home.\"", "Anything about the attorney's case or its merits. Money side only.", "\"We place loans\" or any rate as ours. Licensed lenders lend; we INTRODUCE.", "\"My supervisor\" · \"our attorneys\" · \"my clients\" · company + \"30 years.\"", "Money up front. No fees, ever (MARS + FS 501.1377).", "\"Foreclosure\" to someone who is not the owner.", "An argument. Calls end warm."], "obj": [{"n": 1, "t": "The Bank Mod Shield", "say": "“The bank is already working with me on a modification. I don't want to mess that up by talking to anyone else.”", "reb": ["Good — you should absolutely keep working that modification, and nothing we do touches it. Let me ask you one thing: if talking to me couldn't interfere with the mod at all, is there any other reason not to spend ten minutes?", "Here's what most people don't know: in Florida the mod review and the foreclosure case run on separate tracks. The court date keeps moving while the bank 'reviews,' and denial letters routinely land two or three weeks before the sale — with no time left to react. It's like driving with a spare in the trunk: you don't need it until the tire blows on the highway. What if that denial comes 20 days out — what's your move that day? The consult is free, no fees ever, no commitment. If the mod comes through, we shake hands and part friends."], "one": "The mod review and the sale date run on separate tracks — the court doesn't pause while the bank 'reviews.'", "es": {"say": "El banco ya está trabajando conmigo en una modificación. No quiero dañar eso hablando con otra persona.", "reb": ["Muy bien, y siga con esa modificación — nada de lo que hacemos la toca. Déjeme preguntarle una sola cosa: si hablar conmigo no pudiera afectar la modificación en lo absoluto, ¿habría alguna otra razón para no escuchar diez minutos, o es solamente eso?", "Esto es lo que casi nadie sabe: en la Florida la revisión de la modificación y el caso de la corte corren por carriles separados. La fecha de la corte sigue avanzando mientras el banco \"revisa\", y las cartas de negación llegan a menudo pocos días antes de la subasta. Es como reparar el motor mientras el carro sigue rodando hacia el semáforo: la reparación es real, pero el semáforo no espera. ¿Y si la modificación le llega negada con dos semanas por delante — quiere estar viendo sus opciones ese día, o tenerlas ya listas? Sin costo y sin compromiso. ¿Verdad que sí?"], "one": "La revisión de la modificación y la fecha de la subasta corren por carriles separados — la corte no se detiene mientras el banco \"revisa\"."}}, {"n": 2, "t": "The Lawyer Shield", "say": "“My attorney is handling it. Talk to him, not me.”", "reb": ["Keep your attorney — seriously, we work WITH counsel, never around them, and having defense in place puts you ahead of most people I talk to. One question though: your lawyer is defending the case. Has anyone sat down with you and shown what happens to your equity when the defense runs out?", "Defense buys time; it doesn't decide what you do with the time. Meanwhile the bank's fees and daily interest run against your equity every month the case drags. Your attorney is playing defense — but nobody's playing offense on your money. What if the judge rules against you at the next hearing and you've got weeks, not months — is there a plan for that day, or just the appeal? Ten free minutes with a senior advisor, 30-plus years, coordinated with your lawyer, no fees ever. If your counsel says we're not needed, we shake hands and part friends."], "one": "Your lawyer is playing defense — nobody is playing offense on your equity while the meter runs.", "es": {"say": "Mi abogado se está encargando. Hable con él, no conmigo.", "reb": ["Quédese con su abogado — en serio, nosotros trabajamos CON los abogados, nunca por encima de ellos, y tener defensa puesta lo pone por delante de la mayoría de la gente con la que hablo. Una pregunta nada más: su abogado está defendiendo el caso. ¿Alguien se ha sentado con usted a mostrarle qué pasa con su equidad cuando la defensa se acabe?", "La defensa compra tiempo; no decide qué hace usted con ese tiempo. Mientras tanto los honorarios del banco y los intereses diarios corren contra su equidad cada mes que el caso se alarga. Su abogado juega a la defensa, pero nadie está jugando a la ofensiva con su dinero. ¿Y si el juez falla en contra en la próxima audiencia y le quedan semanas y no meses — hay un plan para ese día, o solamente la apelación? Diez minutos gratis con nuestro asesor principal, más de treinta años en esto, coordinado con su abogado, sin honorarios nunca. Si su abogado dice que no hacemos falta, nos damos la mano y quedamos como amigos."], "one": "Su abogado juega a la defensa — nadie está jugando a la ofensiva con su equidad mientras el reloj corre."}}, {"n": 3, "t": "The Postponement Gambler", "say": "“That sale date doesn't mean anything. It's been cancelled twice already. It always gets pushed.”", "reb": ["You're right that sales get reset — you've lived it twice, so I'm not going to tell you deadlines never move. But let me ask: do you know WHY those two got pushed? Because each cancellation had a reason — a review, a motion — and those reasons run out.", "And here's the part nobody mentions: every push was billed to you. Post-judgment interest runs daily — call it $70-plus a day on a $300k judgment — plus new attorney fees each reset, all coming out of your equity. When one finally holds, the certificate of title can issue about ten days after the auction, and every option collapses to zero. It's the hurricane that turned away twice — the third one doesn't care about your track record. What if this is the date that sticks and you've got ten days? Having the plan ready costs you nothing — free, no fees, no commitment. If it pushes again, we've lost nothing and we part friends."], "one": "Every postponement was billed to your equity at $70 a day — and the hurricane that turned twice doesn't care about your track record.", "es": {"say": "Esa fecha de subasta no significa nada. Ya la cancelaron dos veces. Siempre la empujan.", "reb": ["Tiene razón en que las subastas se posponen — usted lo ha vivido dos veces, así que no le voy a decir que las fechas nunca se mueven. Pero déjeme preguntarle: ¿sabe POR QUÉ se pospusieron esas dos? Porque cada cancelación tuvo un motivo — una revisión, una moción — y esos motivos se agotan.", "Y esta es la parte que nadie menciona: cada posposición se la cobraron a usted. El interés después del fallo corre a diario — ponga setenta dólares o más por día sobre un fallo de trescientos mil — más honorarios nuevos de abogado en cada reprogramación, todo saliendo de su equidad. Cuando una por fin se sostiene, el certificado de título puede salir unos diez días después de la subasta, y ahí todas las opciones se van a cero. Es el huracán que se desvió dos veces: el tercero no sabe de su historial. ¿Y si esta es la fecha que se queda y le quedan diez días? Tener el plan listo no le cuesta nada — gratis, sin honorarios, sin compromiso. Si se pospone otra vez, no perdimos nada y quedamos como amigos."], "one": "Cada posposición se la cobraron a su equidad a setenta dólares por día — y el huracán que se desvió dos veces no sabe de su historial."}}, {"n": 4, "t": "The Incoming Check", "say": "“I'm waiting on my tax refund and a settlement check. Once that comes in, I'll catch everything up.”", "reb": ["Money on the way is a real asset — I'm not dismissing it. Let me isolate one thing: if that check clears before the sale date, you're fine. So the only question is what happens if it doesn't. Fair?", "Here's the problem: your check runs on the IRS's clock or an insurance adjuster's clock — no deadline, slips for months, can get offset. The foreclosure runs on a court clock with a judge attached. You're racing a train to the crossing, and only one of you has a schedule. And remember, the payoff grows daily while you wait, so the check has to beat the clock AND cover a bigger number. What if it lands two weeks after the sale? At that point the money arrives and the house is already gone — after the sale it can't buy it back. Let's map the backup for free, no fees ever. If the check wins the race, use it and we part friends."], "one": "Your check runs on the IRS's clock; the foreclosure runs on a judge's clock — only one of those has a schedule.", "es": {"say": "Estoy esperando mi reembolso de impuestos y un cheque de un acuerdo. Cuando entre, pongo todo al día.", "reb": ["Dinero en camino es un activo real — no se lo estoy quitando. Déjeme aislar una sola cosa: si ese cheque entra antes de la fecha de la subasta, usted está bien. Entonces la única pregunta es qué pasa si no entra. ¿Le parece justo?", "El problema es este: su cheque corre en el reloj del IRS o en el reloj de un ajustador de seguros — sin fecha límite, se atrasa meses, y hasta se lo pueden descontar. La ejecución corre en el reloj de la corte, con un juez y una fecha. Solamente uno de esos dos relojes tiene horario. ¿Y si el cheque entra tres semanas después de la subasta? Diez minutos gratis y tiene un plan B que no le cuesta nada tener guardado. ¿No le parece?"], "one": "Su cheque corre en el reloj del IRS; la ejecución corre en el reloj del juez — solamente uno de los dos tiene horario."}}, {"n": 5, "t": "The Family Money", "say": "“My brother is lending me the money. We're handling it inside the family.”", "reb": ["That's the best kind of help — family money with no strings. One question: is the only thing standing between you and fixing this the money arriving, or has anyone actually pulled the exact reinstatement figure from the bank yet?", "Here's the trap: that number isn't your missed payments. It's payments plus late fees plus the bank's attorney fees plus daily interest — on a $300k judgment that's roughly $70 to $80 a day — and the quote itself takes the bank 5 to 10 business days to issue and then expires. It's like a flight: being at the airport doesn't matter if the doors close before you're in the seat. What if the real number comes back $10k higher than your brother planned for, two weeks before the sale? Let's get the real figure and a backup option on paper — free, no fees ever. If your brother's wire clears in time, we shake hands and part friends."], "one": "The reinstatement number isn't your missed payments — it's payments plus fees plus $70 a day, and the quote takes the bank a week just to issue.", "es": {"say": "Mi hermano me está prestando el dinero. Lo estamos resolviendo en familia.", "reb": ["Esa es la mejor ayuda que hay — dinero de familia y sin condiciones. Una pregunta: ¿lo único que falta entre usted y arreglar esto es que llegue el dinero, o alguien ya pidió la cifra exacta de reinstalación por escrito al banco?", "Aquí está la trampa: esa cifra no son sus pagos atrasados. Son los pagos, más los cargos por mora, más los honorarios del abogado del banco, más el interés diario — sobre un fallo de trescientos mil, unos setenta u ochenta dólares por día. Es como pedir el precio del pasaje una semana antes de volar: el número que usted tiene en la cabeza no es el número de hoy. Y la carta oficial con esa cifra el banco se demora una semana o más en darla. ¿Y si el dinero de su hermano alcanza para el número viejo pero no para el nuevo? Diez minutos gratis con nuestro asesor principal y usted sabe la cifra real antes de pedirle nada a su familia. ¿Verdad que sí?"], "one": "La cifra de reinstalación no son sus pagos atrasados — son pagos más cargos más setenta dólares diarios, y el banco se demora una semana en darle esa carta."}}, {"n": 6, "t": "The Bankruptcy Pause Button", "say": "“My lawyer is filing bankruptcy. That stops all of this, so there's nothing to talk about.”", "reb": ["Smart move to have that option ready — the automatic stay is real and it does pause the sale. Just so I understand: if the bankruptcy only pauses this instead of ending it, would it be worth ten minutes to know what happens on the other side?", "Bankruptcy is a pause button, not an eraser. The lender typically files a motion for relief from stay, and those get heard in 30 to 60 days — then the clock restarts exactly where it stopped, with the arrears still owed. In a Chapter 13 you're paying the full arrears back on top of the regular payment. It's like pausing a movie: when you hit play, you're at the same scene. What if the stay lifts in 45 days — do you want your equity options mapped before or after that? Free consult, no fee ever. If the plan holds, great — we part friends."], "one": "Bankruptcy is a pause button, not an eraser — when the stay lifts, you're at the same scene with the same arrears.", "es": {"say": "Mi abogado va a radicar bancarrota. Eso detiene todo esto, así que no hay nada de qué hablar.", "reb": ["Bien pensado tener esa opción lista — la parada automática es real y sí detiene la subasta. Nada más para entenderlo bien: si la bancarrota solamente pausa esto en vez de terminarlo, ¿valdría diez minutos saber qué pasa el día que se levante la pausa?", "La bancarrota es un botón de pausa, no un borrador. El prestamista normalmente radica una moción para levantar la parada, y esas se ven en treinta a sesenta días — y ahí el reloj arranca exactamente donde se quedó, con los mismos atrasos y ahora con honorarios nuevos encima. Es pausar la película: cuando le da play, la escena sigue igualita. ¿Y si le levantan la parada en cuarenta días y usted no tiene nada preparado para ese día? La consulta es gratis y no interfiere con su abogado. ¿No le parece justo?"], "one": "La bancarrota es un botón de pausa, no un borrador — cuando se levanta la parada usted está en la misma escena y con los mismos atrasos."}}, {"n": 7, "t": "The Scam Fatigue Wall", "say": "“I already talked to three of you people. You all want the same thing. Get off my porch.”", "reb": ["Honestly? You should be suspicious — most of the people knocking want to buy your house cheap, today, with a contract in their hand. Let me ask you straight: if I'm not here to buy your house and there's nothing to sign, is there another reason not to talk?", "We start with a free consultation with a senior advisor — 30-plus years doing this — and we lay out three to five options, including ones where you keep the house: refinance, modification through counsel, selling with your equity. No fees, ever, by law and by policy. Three bad mechanics doesn't mean the engine fixes itself. What if the fourth conversation is the one where someone finally shows you the option that protects your equity instead of taking it? Ten minutes, nothing to sign. Worst case, we shake hands and part friends — that's the actual deal."], "one": "Three bad mechanics doesn't mean the engine fixes itself — and I'm not here with a contract.", "es": {"say": "Ya hablé con tres de ustedes. Todos quieren lo mismo. Váyase de mi puerta.", "reb": ["¿Honestamente? Usted debería desconfiar — la mayoría de los que tocan quieren comprarle la casa barata, hoy, con un contrato en la mano. Se lo pregunto directo: si yo no vengo a comprarle la casa y no le voy a pedir ni una firma ni un centavo hoy, ¿hay alguna otra razón para no escuchar dos minutos?", "Nosotros empezamos con una consulta gratis con nuestro asesor principal — más de treinta años haciendo esto — y le ponemos sobre la mesa de tres a cinco opciones, incluyendo las que le dejan la casa. Nunca le cobramos un centavo por adelantado, y eso no es un favor, es la ley. Tres mecánicos malos no quieren decir que el motor se arregla solo. ¿Y si en cinco minutos le señalamos algo que ninguno de esos tres vio? Usted no pierde nada — ¿verdad?"], "one": "Tres mecánicos malos no quieren decir que el motor se arregla solo — y yo no vengo con un contrato."}}, {"n": 8, "t": "The Wrong House (Denial)", "say": "“You've got the wrong house. We're not in any foreclosure.”", "reb": ["I hope I do have the wrong house — honestly, that would be the best news of my day. Can I ask you one thing, though, just so I can leave you in peace: if a case had been filed at the courthouse under this address, would you want to be the first to know, or the last?", "Because a filing isn't a verdict on you — it's a clock, and the people who look at it early are the ones who keep choices. It's like a lab result sitting in a drawer: reading it doesn't make you sick, it tells you what's treatable. What if ten free minutes with an advisor who's done this for thirty years showed you three or four ways this ends on your terms? If nothing's filed, wonderful — we shake hands and part friends. Is it fair to at least look together?"], "one": "If something had been filed under this address, would you rather be the first to know or the last?", "es": {"say": "Usted tiene la casa equivocada. Aquí no hay ninguna ejecución.", "reb": ["Ojalá tenga la casa equivocada — de verdad, sería la mejor noticia de mi día. ¿Le puedo preguntar una sola cosa, nada más para dejarlo tranquilo? Si se hubiera radicado un caso en la corte con esta dirección, ¿usted querría saberlo, o preferiría que no le dijera nada?", "Porque un caso radicado no es un veredicto sobre usted — es un reloj, y los que lo miran temprano son los que se quedan con opciones. Es como un resultado de laboratorio guardado en una gaveta: leerlo no lo enferma, y no leerlo no lo cura. ¿Y si le doy el número del caso y usted mismo lo verifica en el récord de la corte, sin hablar conmigo nunca más? No le cuesta nada y queda tranquilo de una forma u otra. ¿No le parece?"], "one": "Si se hubiera radicado algo bajo esta dirección, ¿preferiría ser el primero en enterarse o el último?"}}, {"n": 9, "t": "It's Too Late (Hopelessness)", "say": "“There's a sale date already. It's over — there's nothing anybody can do now.”", "reb": ["I hear you — and after months of this, being tired makes all the sense in the world. But let me ask just one thing: is it that nothing can be done, or that you're done? Those are two different things, and only one of them is true.", "A sale date is a deadline, not a verdict — sales get postponed, cases get reworked, and even on the hardest path there's a world of difference between walking out with cash for your keys and time to land, versus being put out with nothing. It's like the two-minute warning in a game: that's not when you leave the stadium, that's when the plays matter most. What if the last ten minutes you spend on this house are the ones that decide how your family walks out of it? You've fought this long — isn't it fair to yourself to hear what's still on the table?"], "one": "A sale date is a deadline, not a verdict — and the last ten minutes are when the plays matter most.", "es": {"say": "Ya hay fecha de subasta. Se acabó, ya no hay nada que nadie pueda hacer.", "reb": ["Lo escucho — y después de meses con esto, estar cansado tiene todo el sentido del mundo. Pero déjeme preguntarle una sola cosa: ¿es que no se puede hacer nada, o es que usted ya no puede más? Porque esas son dos cosas distintas.", "Una fecha de subasta es una fecha límite, no un veredicto — las subastas se posponen, los casos se reestructuran, y hasta en el camino más duro hay una diferencia enorme entre salir con dinero en la mano y salir sin nada. Es el partido en el último minuto: ahí es cuando las jugadas importan más, no menos. ¿Y si en cinco minutos gratis nuestro asesor principal le muestra una jugada que todavía queda? Si no queda ninguna, se lo decimos de frente y quedamos como amigos."], "one": "Una fecha de subasta es una fecha límite, no un veredicto — y los últimos diez minutos son cuando las jugadas más importan."}}, {"n": 10, "t": "She Doesn't Know (Family Secret)", "say": "“My wife doesn't know how bad it is. You have to go before she comes out here.”", "reb": ["I'll step back — and I want you to know I understand why you've carried this alone; you were trying to protect her. One quiet question before I go: would you rather she hear it from you, with a plan in your hand — or from a notice taped to the door?", "Because a secret like this has a deadline, and the court sets it, not you. Telling her with options is like a pilot announcing turbulence along with the route around it — scary for a second, then everyone breathes. Telling her at the end is the crash landing. What if ten free, private minutes — just you and an advisor, before any conversation at home — gave you the words and the plan to bring to her? Isn't it fair that when she finds out, she finds out you were already fighting for her?"], "one": "She's going to find out — the only choice left is whether she hears it from you with a plan, or from a notice on the door.", "es": {"say": "Mi esposa no sabe lo mal que está esto. Tiene que irse antes de que ella salga.", "reb": ["Me hago para atrás — y quiero que sepa que entiendo por qué ha cargado esto solo; usted la estaba protegiendo. Una pregunta tranquila antes de irme: ¿preferiría que ella lo escuche de usted, con un plan en la mano, o de un papel pegado en la puerta?", "Porque un secreto así tiene fecha de vencimiento, y la pone la corte, no usted. Decírselo con opciones es como el piloto que anuncia la turbulencia junto con la ruta para esquivarla: da miedo un segundo y después todo el mundo respira. Decírselo al final es el aterrizaje de emergencia. ¿Y si diez minutos gratis y privados — usted y el asesor, antes de cualquier conversación en la casa — le dieran las palabras y el plan para llevárselo a ella? ¿No es justo que cuando ella se entere, se entere de que usted ya estaba peleando por ella?"], "one": "Ella se va a enterar — lo único que queda por decidir es si lo escucha de usted con un plan, o de un aviso en la puerta."}}, {"n": 11, "t": "Worn Out — \"Just take it, I'm done\"", "say": "“Honestly I'm fed up. I'm worn out. I don't think I can afford this even if a miracle came down from heaven. I'd be better off walking away from all this stress.”", "reb": ["I hear you, and the majority of people we speak to hit that exact wall — they just want to get away from all the problems, and that's fair. Everybody gets there at some point. Let me ask you one thing: what is it that you TRULY want to do with this property?", "If you've truly had it, then rather than the bank taking the house AND whatever equity you have, I'm sure you'd rather walk out with cash in your pocket, on your own timeline, with dignity — instead of a sheriff putting your things on the street on a date you don't control. We have a program for exactly this — Cash for Keys. We agree on a set figure; you get half the money up front when we sign, and you pick your exit window: 30, 60 or 90 days. The longer you stay the number adjusts a little — not a lot — because our money sits parked. At the end you hand over the keys, the house is clear of your personal things, and you receive the other half that same day. You pick the date. You pick the time. You run the show.", "Let me review the file — what's owed, what it's worth, what condition it's in — and give me fifteen, twenty minutes. I'll come back with a real figure, and if it makes sense to both of us I'll have one of our people at your door and cash moving today."], "one": "Walk out with cash and a date YOU picked — or let the sheriff pick it for you.", "es": {"say": "Sinceramente estoy agotado. No puedo con esto ni aunque bajara un milagro del cielo. Mejor lo dejo todo.", "reb": ["Lo entiendo, y la mayoria de las personas con las que hablamos llegan a ese mismo punto — quieren alejarse de todos los problemas, y es justo. Dejeme preguntarle una sola cosa: que es lo que usted VERDADERAMENTE quiere hacer con esta propiedad?", "Si de verdad ya no puede mas, en vez de que el banco se quede con la casa Y con su plusvalia, mejor salga con dinero en el bolsillo, en su propia fecha, con dignidad — y no con el sheriff poniendo sus cosas en la calle un dia que usted no controla. Tenemos un programa exactamente para esto — Cash for Keys. Acordamos una cifra; le damos la MITAD por adelantado al firmar, y usted escoge su plazo: 30, 60 o 90 dias. Al final entrega las llaves, la casa queda libre de sus cosas personales, y recibe la otra mitad ese mismo dia. Usted escoge la fecha. Usted manda.", "Deme quince o veinte minutos para revisar el expediente — lo que se debe, lo que vale — y regreso con una cifra real. Si nos hace sentido a los dos, hoy mismo movemos el dinero."], "one": "Salga con dinero y una fecha que USTED escogio — o deje que el sheriff la escoja."}}, {"n": 12, "t": "The Overpriced Listing (Realtor gatekeeper)", "say": "The agent has it listed at $429k with ten days to the sale, zero showings — and shields the owner from every call.", "reb": ["I'm not here to point fingers — whether the 429 was your idea or your client's, I honestly don't care. I'm here to stop a foreclosure, make this work for your client, make it work for you, and maybe for one of my investors. But the first thing we all have to do is take a big bite of reality pie on that price with a sale date ten days out.", "Here's the good part for you: if we work together and my investor buys it, you keep the FULL commission on this sale — I'll hand my side to you. And when we resell it after the work, you get the listing AGAIN. The same property pays you twice, and nobody else calling on this file is offering you that. Now — your client needs to hear the truth about the number. If you want backup, I'll do it with you on the line. If you'd rather I call him independently, I will. Or you handle it yourself. Any of the three works, but one of them happens this week."], "one": "Same property, two commissions — but only if the price meets reality this week.", "es": {"say": "El agente lo tiene listado en $429 mil, a diez dias de la subasta, sin visitas — y no deja pasar ninguna llamada al dueno.", "reb": ["No vengo a senalar culpables — si el precio fue idea suya o de su cliente, sinceramente no me importa. Vengo a detener una ejecucion, a que esto funcione para su cliente, para usted, y quizas para uno de mis inversionistas. Pero lo primero es aceptar la realidad de ese precio con una subasta a diez dias.", "Y esto es lo bueno para usted: si trabajamos juntos y mi inversionista compra, usted se queda con la comision COMPLETA de esta venta — yo le cedo mi parte. Y cuando la revendamos despues del trabajo, usted vuelve a tener el listing. La misma propiedad le paga dos veces, y nadie mas en este expediente le esta ofreciendo eso. Ahora — su cliente necesita oir la verdad del numero. Si quiere respaldo, lo hago con usted en la linea; si prefiere, lo llamo yo aparte; o lo maneja usted solo. Cualquiera de las tres funciona, pero una de las tres pasa esta semana."], "one": "La misma propiedad, dos comisiones — si el precio acepta la realidad esta semana."}}, {"n": 13, "t": "The Parachute Frame (universal — any rescue plan they believe in)", "say": "“I've got it handled — the bank's reviewing my modification / my money arrives tomorrow / my cousin is wiring it.” Any plan they're emotionally invested in, 7–10 days out.", "reb": ["I'm applauding you — you did the right thing, and I commend you for getting the ball rolling. Keep doing exactly what you're doing. One question, though: do you have the approval in writing? Because a lot of banks drag the review out and deny two or three days before the sale — and the denial can go straight to their attorneys without you ever seeing it. As much as neither of us wants to look at it, you'd agree that's a real possibility, right?", "So here's what I'm proposing — I don't want to be your bank, and I don't want to be your middleman. I want to be your parachute. You're betting your house on that plan landing on time; let us work on postponing the sale in parallel, so if the money or the approval comes a day late, the extra time is already in motion and your plan still saves the house. If your plan works, beautiful — I did you a favor and you owe me one. And the no-cost version: give me a third-party authorization — just permission to speak to your bank, nothing else, no fees — I'll make one courtesy call and get the bottom line on where your file really is. Based on that, we decide if we work together at all. Fair?"], "one": "You're betting your house on the timing — keep the plan, and let me be the parachute.", "es": {"say": "Ya lo tengo resuelto — el banco esta revisando mi modificacion / el dinero me llega manana / mi primo me lo manda.", "reb": ["Lo felicito — hizo lo correcto, y le aplaudo que haya puesto la bola en movimiento. Siga haciendo exactamente lo que esta haciendo. Una pregunta nada mas: tiene la aprobacion por escrito? Porque muchos bancos alargan la revision y niegan dos o tres dias antes de la subasta — y la negacion puede irse directo a sus abogados sin que usted la vea. Por mucho que no queramos mirarlo, usted estaria de acuerdo en que esa posibilidad existe, verdad?", "Entonces esto es lo que le propongo — yo no quiero ser su banco, ni su intermediario. Quiero ser su paracaidas. Usted esta apostando su casa a que ese plan llegue a tiempo; dejenos trabajar el aplazamiento de la venta en paralelo, para que si el dinero o la aprobacion llega un dia tarde, la subasta ya este detenida y su plan todavia salve la casa. Si su plan funciona, perfecto — le hice un favor y me debe uno. Y la version sin costo: deme una autorizacion de tercero — solo permiso para hablar con su banco, nada mas, sin honorarios — hago una llamada de cortesia y le traigo la verdad de donde esta su expediente. Con eso decidimos si trabajamos juntos o no. Justo?"], "one": "Usted esta apostando su casa al calendario — quedese con su plan, y dejeme ser el paracaidas."}}, {"n": 14, "t": "CLOSE — Save My Number (the read-back test)", "say": "Nothing — this is YOUR move at the end of any call that went well, before you hang up.", "reb": ["Do me one favor before we hang up. I've invested my time, and I'm going to keep investing it after this call — so save my number right now. My name is Jesse. The company is Miami Solutions Group — just put MSG, that's how it shows on your caller ID. This is my personal cell, and let me give you the office number too. Now read it all back to me — I want to make sure you got everything right.", "If they read it back clean, they're in. If \"my pen ran out of ink\" or they ask you to repeat it, they're tepid — tighten the follow-up and don't count the deal. Same muscle, bigger size: the paperwork trial close. \"Let me get the paperwork together — I'll email it, we go over it, and if we agree we shake hands. If not, I wasted fifteen minutes of my time and we part friends. Nothing gambled on your part. Sound fair?\" Their reaction to concrete paperwork IS the temperature reading. And when they're warm but need authority: \"Just get on the phone with our senior advisor for five minutes and we'll find a solution for this property.\""], "one": "If they read it back clean they're in — if the pen 'ran out of ink,' they're not.", "es": {"say": "Nada — este es SU movimiento al final de toda llamada que fue bien, antes de colgar.", "reb": ["Hagame un favor antes de colgar. Yo he invertido mi tiempo y voy a seguir invirtiendolo despues de esta llamada — asi que guarde mi numero ahora mismo. Mi nombre es Jesse. La compania es Miami Solutions Group — pongale MSG, asi le sale en el identificador. Este es mi celular personal, y le doy tambien el de la oficina. Ahora leamelo todo de vuelta — quiero asegurarme de que lo tiene bien.", "Si lo lee de vuelta completo, esta DENTRO. Si \"se le acabo la tinta\" o le pide que se lo repita, esta tibio — apriete el seguimiento y no cuente el negocio. El mismo musculo en tamano grande: el cierre de papeleria. \"Dejeme preparar los papeles — se los mando por correo, los repasamos, y si estamos de acuerdo nos damos la mano. Si no, perdi quince minutos de mi tiempo y quedamos como amigos. Usted no arriesga nada. Le parece justo?\" Y cuando estan tibios pero necesitan autoridad: \"Pongase al telefono con nuestro asesor principal cinco minutos y le encontramos una solucion a esta propiedad.\""], "one": "Si lo lee de vuelta completo esta dentro — si \"se acabo la tinta\", no lo esta."}}]}, ciocIdx=-1, objIdx=-1;
function sheetToggle(){ $('sheet').classList.toggle('open'); }

/* ONE LANGUAGE AT A TIME. Every script block used to render EN and ES stacked — on the call screen
   that stacked the opener twice, the close cue, the drawer peek and (on voicemail) two more blocks:
   his words, "too many transcripts, keep one on the screen." The board's both-languages instinct
   was right for a LIST you scan; on a phone mid-call it is double the reading at the worst moment.
   The chosen language persists (fcLang); the other is ONE tap away on the EN|ES chips. */
function lang(){ try{ return localStorage.getItem('fcLang')==='es' ? 'es' : 'en'; }catch(e){ return 'en'; } }
function setLang(v){
  try{ localStorage.setItem('fcLang', v); }catch(e){}
  // repaint whichever script surfaces are up, without touching flow state.
  // NOT while a voicemail script is visible: that block repaints itself, and a full rebuild here
  // would wipe the script mid-read and re-enable buttons for an outcome already logged.
  var vmUp = $('vm') && $('vm').style.display === 'block';
  if(SCREEN==='outcome' && cur && !vmUp){ screenOutcome(); }
  else if(SCREEN==='lead' && cur){ screenLead(); }
  if(cur) renderSheet(cur);
}
function langChips(){
  var L=lang();
  return '<span class="lchips"><button class="lchip'+(L==='en'?' on':'')+'" data-lang="en">EN</button>'
       + '<button class="lchip'+(L==='es'?' on':'')+'" data-lang="es">ES</button></span>';
}
function wireLang(root){
  Array.prototype.forEach.call((root||document).querySelectorAll('.lchip'), function(b){
    b.onclick=function(ev){ ev.stopPropagation(); setLang(b.dataset.lang); };
  });
}
function say(en, es, r){
  if(lang()==='es' && es) return '<div class="say es">'+esc(fillScript(es, r))+'</div>';
  return '<div class="say">'+esc(fillScript(en, r))+'</div>'
       + (lang()==='es' && !es ? '<div class="noes">No Spanish version of this line yet.</div>' : '');
}

function renderSheet(r){
  // Named vs anonymous opener — see firstName(). No usable name means ask for the owner instead of
  // greeting a company, a placeholder, or a name the card just told him not to use.
  var named = !!firstName(r);
  var opEN = named ? SCRIPT.op.en : SCRIPT.op.aen;
  var opES = named ? SCRIPT.op.es : SCRIPT.op.aes;
  // PEEK — the first thing out of his mouth, plus the close cue, always one glance away.
  var op = fillScript(opEN, r);
  $('peek').innerHTML = '<b>'+esc(op.split('.')[0])+'.</b> '
    + '<span class="mut">&hellip; tap for the full script</span>'
    + '<div class="mut" style="margin-top:4px">Close with: <b>That&rsquo;s fair, right?</b></div>';

  var b = '<div class="ltag">THE OPENER '+langChips()+'</div>'
        + say(opEN, opES, r)
        + (named ? '' : '<div class="noes">No usable first name on this lead &mdash; ask for the owner rather than guessing at one.</div>');

  // CIOC as nav — tap a beat, get its words.
  b += '<div class="cioc">';
  SCRIPT.cioc.forEach(function(c,ix){ b += '<button data-cioc="'+ix+'"'+(ciocIdx===ix?' class="on"':'')+'>'+esc(c.k)+'</button>'; });
  b += '</div>';
  if(ciocIdx>=0){
    var c=SCRIPT.cioc[ciocIdx];
    b += '<div class="mut" style="font-size:12px">'+esc(c.w)+'</div><div class="say">'+esc(c.s)+'</div>';
  }

  b += '<div class="ltag">IF YOU ONLY GET 15 SECONDS</div><div class="say">'+esc(fillScript(SCRIPT.f15, r))+'</div>';

  // OBJECTIONS — tap what you are hearing.
  b += '<div class="ltag">THEY PUSHED BACK &mdash; tap what you heard</div>';
  if(!SCRIPT.obj.length){
    b += '<div class="noes">Objection cards unavailable in this build (drill pack not readable at build time).</div>';
  } else {
    b += '<div class="objs">';
    SCRIPT.obj.forEach(function(o,ix){ b += '<button data-obj="'+ix+'"'+(objIdx===ix?' class="on"':'')+'>'+esc(o.t)+'</button>'; });
    b += '</div>';
    if(objIdx>=0){
      var o=SCRIPT.obj[objIdx];
      b += '<div class="mut" style="font-size:12px;margin-top:6px">They say: &ldquo;'+esc(o.say)+'&rdquo;</div>';
      b += '<div class="ltag">EN</div>';
      o.reb.forEach(function(p){ b += '<div class="say">'+esc(p)+'</div>'; });
      if(o.one) b += '<div class="ltag">IF YOU ONLY GET ONE SENTENCE</div><div class="say">'+esc(o.one)+'</div>';
      if(o.es){
        b += '<div class="mut" style="font-size:12px;margin-top:12px">Dicen: &ldquo;'+esc(o.es.say)+'&rdquo;</div>';
        b += '<div class="ltag es">ES</div>';
        o.es.reb.forEach(function(p){ b += '<div class="say es">'+esc(p)+'</div>'; });
        if(o.es.one) b += '<div class="ltag es">SI SOLO LE DA TIEMPO A UNA FRASE</div><div class="say es">'+esc(o.es.one)+'</div>';
      } else {
        // never a blank card — say plainly that the Spanish does not exist for this one
        b += '<div class="noes">No Spanish version of this card yet.</div>';
      }
    }
  }

  b += '<div class="ltag">MARS &mdash; say this at the TOP of any advisor consult</div>'
     + '<div class="say">'+esc(SCRIPT.mars)+'</div>';

  b += '<div class="never"><b>NEVER SAY</b><br>';
  SCRIPT.never.forEach(function(n){ b += '&bull; '+esc(n)+'<br>'; });
  b += '</div>';

  $('sbody').innerHTML = b;
  // delegated so the handlers survive every re-render of the body
  Array.prototype.forEach.call($('sbody').querySelectorAll('[data-cioc]'), function(el){
    el.onclick=function(){ ciocIdx = (ciocIdx===+el.dataset.cioc) ? -1 : +el.dataset.cioc; renderSheet(cur); };
  });
  Array.prototype.forEach.call($('sbody').querySelectorAll('[data-obj]'), function(el){
    el.onclick=function(){ objIdx = (objIdx===+el.dataset.obj) ? -1 : +el.dataset.obj; renderSheet(cur); };
  });
  wireLang($('sbody'));
}
$('grip').onclick=sheetToggle;
$('peek').onclick=sheetToggle;

$('pill').onclick=function(){
  /* The pill sits above the sheet grip and used to reload INSTANTLY — mid-call, unconfirmed.
     Off the lead screen (call in progress), reloading needs a deliberate yes. */
  if(SCREEN!=='lead' && !confirm('Load the newer list now? Your logs are saved, but the screen resets to the top of the queue.')) return;
  location.reload();
};
/* Returning to the page means he just finished a call. Pull then (teammate opt-outs matter before
   the next dial) and re-check freshness. Do NOT poll on a 45s timer here — 200k-iteration PBKDF2
   every 45s on a backgrounded phone is pure battery burn for a page used in bursts. */
document.addEventListener('visibilitychange',function(){
  if(document.hidden) return;
  freshCheck();
  /* Pull first (teammate opt-outs before the next dial), then PUSH: the push fired just before
     the dialer opened may have died when the tab backgrounded — returning is the retry moment. */
  try{ if(localStorage.getItem('fcTeamKey')){ syncPull().then(function(){ loadNotes(); if(touched) return syncPush(); }).catch(function(){}); } }catch(e){}
});
boot();
</script></body></html>
