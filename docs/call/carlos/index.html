ltor / selling it myself", "realtor"], ["Still not interested", "obj:15"]], "ret": "frame"}, {"id": "investor", "k": "\"ARE YOU AN INVESTOR?\" — the honest answer", "en": "Fair question. No, I'm not calling to buy your house. What I do is help owners see every option they've got before that case moves, so whatever you decide, you decide it with all the facts. Can I ask you one thing?", "es": "Buena pregunta. No, no le llamo para comprarle la casa. Lo que hago es ayudar a los dueños a ver todas las opciones que tienen antes de que ese caso avance, para que lo que decida, lo decida con toda la información. ¿Le puedo preguntar una cosa?", "tone": "Calm and unbothered: it's a fair question, not an accusation. Say the true line, 'I'm not calling to buy your house.' NEVER claim we're not investors, and never say 'we specialize in pre-foreclosures'.", "listen": "If they relax, set the frame. If they keep probing, stay honest and short. Never dodge.", "br": [["Okay, what is it?", "frame"], ["I'm a realtor / selling it myself", "realtor"], ["Still not interested", "obj:15"], ["Don't call me again", "end:dnc"]], "ret": "frame"}, {"id": "realtor", "k": "I'M A REALTOR / SELLING IT MYSELF — insure the plan", "en": "Honestly, selling it is a smart move, and you know that market, so I'm not going to throw a number at you. One question, though... when you say sell it soon, do you mean under contract, or closed?", "es": "La verdad, venderla es una buena jugada, y usted conoce ese mercado, así que no le voy a tirar un número. Una pregunta, eso sí... cuando dice venderla pronto, ¿quiere decir bajo contrato, o ya cerrada?", "tone": "Back their plan: you're the parachute, not the competition. NEVER quote their home's value to an agent; ask theirs. Curious on the question, then silence.", "listen": "Let THEM notice the gap between under contract and closed. If they mention illness or family, stop and be human first.", "br": [["\"Closed\" in a month (tight)", "obj:13"], ["\"Under contract\", plenty of time", "q2"], ["It's handled, don't worry", "obj:13"], ["Not interested", "obj:15"]], "ret": "q2"}, {"id": "frame", "k": "THE FRAME — set it before any question", "en": "Honestly, this is pretty basic — I'm really just trying to understand where things stand on {st1} right now... compared to where you'd want them to land... so we can see what that gap looks like. And toward the end, if you feel it might be worth it, we can talk about a couple of possible next steps. Would that help you?", "es": "La verdad, esto es bien sencillo — solo quiero entender cómo está la situación con {st1} ahora mismo... comparado con dónde a usted le gustaría que quedara... para ver cómo se ve esa diferencia. Y al final, si usted siente que pudiera valer la pena, hablamos de un par de posibles pasos a seguir. ¿Le parece que le ayudaría?", "tone": "Neutral, expert, unhurried. You are setting the table, not pitching.", "listen": "Their \"yeah, that'd help\" is the first micro-yes.", "br": [["Sure / that'd help", "q1"], ["What kind of options? (do NOT present — ask)", "q1"], ["I've got it handled", "obj:1"], ["Are you an investor?", "investor"], ["I'm a realtor / selling it myself", "realtor"], ["Not interested", "obj:15"]], "ret": "q1"}, {"id": "q1", "k": "1 · WHAT DO THEY WANT", "en": "Before I get into any of it, what is it you are actually hoping happens with {st1}?", "es": "Antes de meterme en nada, ¿qué es lo que usted de verdad quisiera que pasara con {st1}?", "tone": "Curious. Open question. Their answer picks the program. Open question, never a binary — everything after is built on this.", "listen": "Their answer picks the program. Do not fill the silence.", "br": [["Keep the house", "q2"], ["Sell / get out / start fresh", "q2"], ["Selling it myself / I'm a realtor", "realtor"], ["I don't know", "probe"], ["It's handled / bank / mod", "obj:1"], ["My lawyer's on it", "obj:2"]], "ret": "q2"}, {"id": "probe", "k": "THEY WENT VAGUE — echo it back", "rail": {"en": ["Not 100%?...  (echo whatever they just said)", "What do you mean by that?", "How long's that been going on?", "Has that had an impact on you?...  In what way, though?", "You don't sound so sure — what is it you don't like about how it's going?", "Can you give me a specific example of when that happened?"], "es": ["¿No 100%?...  (repita lo que acaban de decir)", "¿Qué quiere decir con eso?", "¿Cuánto tiempo lleva pasando eso?", "¿Eso le ha afectado?...  ¿De qué manera?", "No lo escucho muy seguro — ¿qué es lo que no le gusta de cómo va la cosa?", "¿Me puede dar un ejemplo específico de cuándo pasó eso?"]}, "tone": "Mirror their last words as a question. Get specific. One at a time.", "listen": "Pick ONE. Then wait.", "br": [["They opened up", "q2"], ["Still won't engage", "f15"]], "ret": "q2"}, {"id": "q2", "k": "2 · PROBLEM AWARENESS", "en": "When the bank or the attorney talked to you about that sale date, did anybody actually explain what happens to your balance every time that date gets pushed back?", "es": "Cuando el banco o el abogado le habló de esa fecha de subasta, ¿alguien de verdad le explicó qué le pasa a su saldo cada vez que esa fecha se pospone?", "tone": "Curious, slow. When they say \"no, nobody explained it\" — LET THE SILENCE SIT. Do NOT explain.", "listen": "Wait for the \"no\". It is your opening — do not fill it.", "br": [["No, nobody explained it", "q3"], ["Yeah, they told me (ask: what'd they tell you?)", "q3"], ["It'll just get pushed again", "obj:3"]], "ret": "q3"}, {"id": "q3", "k": "3 · THE MONEY CONSEQUENCE", "en": "That is what I hear from just about everyone. Every time it moves, the interest and the legal fees keep stacking on top of what you already owe. Have you had a chance to see where that number is really sitting today, or is it a bit of a moving target?", "es": "Eso es lo que escucho de casi todos. Cada vez que se mueve, los intereses y los gastos legales se siguen sumando a lo que ya debe. ¿Ha tenido chance de ver en cuánto está ese número hoy, o es un poco un blanco móvil?", "tone": "Concerned — a doctor, not a closer. Drop the fact, hand it back, STOP. You are not allowed to lecture here.", "listen": "THEY say the number is a moving target. Not you.", "br": [["Moving target / no idea", "q4"], ["I know the number", "q4"], ["I'm fine, don't worry about it", "obj:13"]], "ret": "q4"}, {"id": "q4", "k": "4 · WHAT IT ALREADY COST", "en": "How long has this been hanging over you, and what have you already tried?", "es": "¿Cuánto tiempo lleva cargando con esto, y qué ha intentado ya?", "tone": "Curious. Whatever plan they name — INSURE it, never fight it. You are the parachute.", "listen": "This surfaces the plan they already have. Cushion it before anything else.", "br": [["Bank mod", "obj:1"], ["Lawyer", "obj:2"], ["Money's coming (check / family)", "obj:4"], ["Bankruptcy", "obj:6"], ["Listing it / I'm a realtor", "realtor"], ["Nothing / haven't really tried", "q5"], ["Tried a lot, nothing worked", "q5"]], "ret": "q5"}, {"id": "q5", "k": "5 · THE PERSONAL STAKES", "en": "Let me ask you straight. If nothing changes and that date comes and goes, where does that leave you and your family? That is not something you are willing to just sit back and let happen. Right?", "es": "Le pregunto de frente. Si nada cambia y esa fecha llega y pasa, ¿dónde lo deja a usted y a su familia? Eso no es algo que usted esté dispuesto a dejar pasar así nomás. ¿Verdad?", "tone": "Concerned, low, slow. Assumed statement + ONE tie-down, voice DOWN. Then SILENCE — do not rescue it.", "listen": "They must say the pain out loud. If they do, you have EARNED the close.", "br": [["They said the pain (kids / wreck me / no plan B)", "bridge"], ["\"I'm fine, it'll work out\" (flat)", "conseq"], ["Too late, nothing I can do", "obj:9"]], "ret": "bridge"}, {"id": "conseq", "k": "STILL FLAT — push, with care", "rail": {"en": ["Do you want to have to go through all that... if you... if you didn't have to?", "Can you afford to take that risk?", "Why look at fixing this now? Why not just push it down the road like a lot of people do... who end up losing the house they could've kept?"], "es": ["¿Usted quiere tener que pasar por todo eso... si... si no tuviera que hacerlo?", "¿Se puede dar el lujo de correr ese riesgo?", "¿Por qué ver cómo resolver esto ahora? ¿Por qué no dejarlo para después como hace mucha gente... que termina perdiendo la casa que pudo haber conservado?"]}, "tone": "Challenging but caring — lean in. Pick ONE, voice down, then silence.", "listen": "You want them to defend why they need to act. Let them.", "br": [["They felt it", "bridge"], ["Still flat / not moving", "f15"]], "ret": "bridge"}, {"id": "bridge", "k": "THE BRIDGE — their words back to them", "en": "Okay... based on everything you just told me, this is exactly the kind of thing we can actually help with. Because you said you want [what they want]... and the way that date keeps moving has you feeling [stressed / worried / stuck] — I think you mentioned that a couple times. So here's the one thing I'd want for you before that date hits...", "es": "Bueno... con todo lo que me acaba de decir, esto es justo lo que sí podemos ayudarle a resolver. Porque usted dijo que quiere [lo que quieren]... y la forma en que esa fecha se sigue moviendo lo tiene [estresado / preocupado / atascado] — creo que lo mencionó un par de veces. Así que esto es lo único que quisiera para usted antes de que llegue esa fecha...", "tone": "Calm, voice DOWN. Repeat what THEY want and what THEY feel. Then straight into the ask.", "listen": "No pause needed — flow into the commitment.", "br": [["Continue to the ask →", "q6"]], "ret": "q6"}, {"id": "q6", "k": "6 · THE COMMITMENT", "en": "Before that date hits, you would want to at least see your real options laid out. Right? Our senior advisor has over 30 years in mortgages and foreclosure workouts and he takes five minutes and lays them out. Worst case, you know more than you did this morning. That is fair, right? Let me get you on his calendar. Is later today better, or first thing tomorrow?", "es": "Antes de que llegue esa fecha, usted querría por lo menos ver sus opciones reales sobre la mesa. ¿Verdad? Nuestro asesor principal tiene más de 30 años en hipotecas y en resolver casos de ejecución, y en cinco minutos se las explica. En el peor de los casos, usted sabe más de lo que sabía esta mañana. ¿Le parece justo? Déjeme ponerlo en su calendario. ¿Le queda mejor hoy más tarde, o mañana temprano?", "tone": "EARNED IT? Then: calm, voice DOWN on \"right\". ONE tie-down, then the time. A when — never a whether. No promises.", "listen": "Two ways to say yes. Wait for the time.", "br": [["Later today", "book"], ["Tomorrow morning", "book"], ["Just send me something", "sendinfo"], ["Let me think about it", "think"], ["I'm busy right now", "busy"], ["No thanks, I'm good", "f15"]], "ret": "q6"}, {"id": "sendinfo", "k": "\"JUST SEND ME SOMETHING\"", "en": "Yeah, I can do that for sure... now, just so I send you the right thing and not a stack of junk — what specifically would you want it to show you?", "es": "Claro, con gusto... ahora, para mandarle lo correcto y no un montón de papeles: ¿qué específicamente quisiera que le mostrara?", "tone": "Agreeable, then ONE question. Whatever they say next is their real concern.", "listen": "Never send blind — that is how you never hear back.", "br": [["They told me what they want to see → back to the questions", "q1"], ["They named a concern → handle it, re-ask", "q6"], ["Fine, just send it", "end:talked"]], "ret": "q6"}, {"id": "think", "k": "\"LET ME THINK ABOUT IT\"", "en": "That's fair — most people want to. Just so I make sure I actually answered it... what specifically do you want to think over?", "es": "Es justo — la mayoría quiere pensarlo. Nada más para asegurarme de haberle respondido bien... ¿qué específicamente quiere pensar?", "tone": "Unbothered, curious. Isolate the real concern — do not re-pitch.", "listen": "They will name the thing. Then answer THAT and re-ask.", "br": [["They named the concern → answer it, re-ask", "q6"], ["Still stalling", "f15"]], "ret": "q6"}, {"id": "busy", "k": "\"I'M BUSY / CALL ME BACK\" — flip it", "en": "No problem at all... here's what I'll do — I'll give you my number, and you'd have to call ME back later to catch me. What's your timeframe on getting back to me, just to see if I'd even be free?  ·  Or if you've got your calendar handy, I'll pull mine and we'll lock a specific time so neither of us is chasing the other. My number is {phone}.", "es": "No hay problema... mire, esto es lo que hago — le doy mi número y usted tendría que llamarme A MÍ más tarde para alcanzarme. ¿Cuál es su horario para regresarme la llamada, nada más para ver si yo estaría libre?  ·  O si tiene su calendario a mano, saco el mío y fijamos una hora específica para que ninguno ande persiguiendo al otro. Mi número es {phone}.", "tone": "Unbothered. YOUR time is the scarce one. Get a timeframe or a calendar slot — never \"sure, whenever\".", "listen": "Wait for a time. If they give one, lock it.", "br": [["Gave me a time", "end:callback"], ["Booked a slot", "end:callback"], ["Brushed me off", "end:notint"]], "ret": "q6"}, {"id": "f15", "k": "THE 15-SECOND OUT", "en": "Totally understand. One thing and I am gone: our senior advisor — over 30 years in mortgages and foreclosure workouts — reviews your case free, five minutes, on the phone. If nothing fits, we part friends. Fair?", "es": "Totally understand. One thing and I am gone: our senior advisor — over 30 years in mortgages and foreclosure workouts — reviews your case free, five minutes, on the phone. If nothing fits, we part friends. Fair?", "tone": "Totally relaxed. You are leaving, not chasing. One line, voice down, then let go.", "listen": "Takeaway. Sometimes the door opens on the way out.", "br": [["Okay, fine — five minutes", "book"], ["No", "end:notint"], ["Stop calling me", "end:dnc"]], "ret": "f15"}, {"id": "book", "k": "BOOK IT — read-back test", "en": "Perfect — I've got you down for [the time they picked]. Do me one favor before we hang up: save my number right now... it's {phone}. ... Now read it back to me, so I know you've got it right.", "es": "Perfecto — lo tengo anotado para [la hora que escogió]. Hágame un favor antes de colgar: guarde mi número ahora mismo... es el {phone}. ... Ahora léamelo de vuelta, para saber que lo tiene bien.", "tone": "Slow on the number. A clean read-back means it is real. \"Pen ran out of ink\" = do not count it. Advisor consult: he reads the MARS block first.", "listen": "Listen for the read-back.", "br": [["Read it back clean ✓", "end:appt"], ["Fumbled it / \"pen ran out\" (log it, count it soft)", "end:appt"], ["Backed out", "f15"]], "ret": "book"}, {"id": "gate", "k": "NOT THE OWNER — gatekeeper", "en": "No problem at all — when's usually a good time to catch them? ... Or if it's easier, could I leave my number with you? It's {phone}, and it's about the property on {st1}.", "es": "No hay problema — ¿a qué hora suele estar? ... O si es más fácil, ¿le puedo dejar mi número? Es el {phone}, y es sobre la propiedad en {st1}.", "tone": "Easy, friendly. Never say \"foreclosure\" to anyone but the owner — \"the property\" only.", "listen": "Get a time or leave the number. Nothing else.", "br": [["Got a callback time", "end:callback"], ["Left my number", "end:gate"], ["Hung up", "end:gate"]], "ret": "gate"}, {"id": "vm", "k": "VOICEMAIL — read it live", "en": "Hi {first}, this is {sender} with Biscayne Solutions Group, about {st1}. You may have a plan. Keep it. A plan can land a day late, and here a day is everything. Our senior advisor, thirty plus years, maps your free backup in five minutes. Call me any hour at {phone}. Thanks.", "es": "Hola {first}, le habla {sender} de Biscayne Solutions Group, por {st1}. Si tiene un plan, sígalo. Un plan puede llegar un día tarde, y aquí un día lo es todo. Nuestro asesor principal, más de treinta años, le arma su respaldo gratis en cinco minutos. Llámeme a cualquier hora al {phone}. Gracias.", "tone": "HOW TO SAY IT — low and unhurried, like a neighbor leaving a note, not a salesman. Pause on every '...'. Sound a little detached, almost unsure you've even got the right person — that softness is what earns the callback. Warm, never urgent, and slow down on the phone number so they can write it.", "listen": "Hang up after \"Thanks.\" Do not ramble.", "br": [["Left it", "end:voicemail"]], "ret": "vm"}], "obj": [{"n": 1, "t": "The Bank Mod Shield", "say": "The bank is already working with me on a modification. I don't want to mess that up by talking to anyone else.", "reb": ["Good — you should absolutely keep working that modification, and nothing we do touches it. Let me ask you one thing: if talking to me couldn't interfere with the mod at all, is there any other reason not to spend five minutes?", "Here's what most people don't know: in Florida the mod review and the foreclosure case run on separate tracks. The court date keeps moving while the bank 'reviews,' and denial letters routinely land two or three weeks before the sale — with no time left to react. It's like driving with a spare in the trunk: you don't need it until the tire blows on the highway. What if that denial comes 20 days out — what's your move that day? The consult is free, no fees ever, no commitment. If the mod comes through, we shake hands and part friends."], "one": "The mod review and the sale date run on separate tracks — the court doesn't pause while the bank 'reviews.'", "es": {"say": "El banco ya está trabajando conmigo en una modificación. No quiero dañar eso hablando con otra persona.", "reb": ["Muy bien, y siga con esa modificación — nada de lo que hacemos la toca. Déjeme preguntarle una sola cosa: si hablar conmigo no pudiera afectar la modificación en lo absoluto, ¿habría alguna otra razón para no escuchar cinco minutos, o es solamente eso?", "Esto es lo que casi nadie sabe: en la Florida la revisión de la modificación y el caso de la corte corren por carriles separados. La fecha de la corte sigue avanzando mientras el banco \"revisa\", y las cartas de negación llegan a menudo pocos días antes de la subasta. Es como reparar el motor mientras el carro sigue rodando hacia el semáforo: la reparación es real, pero el semáforo no espera. ¿Y si la modificación le llega negada con dos semanas por delante — quiere estar viendo sus opciones ese día, o tenerlas ya listas? Sin costo y sin compromiso. ¿Verdad que sí?"], "one": "La revisión de la modificación y la fecha de la subasta corren por carriles separados — la corte no se detiene mientras el banco \"revisa\"."}}, {"n": 2, "t": "The Lawyer Shield", "say": "My attorney is handling it. Talk to him, not me.", "reb": ["Keep your attorney — seriously, we work WITH counsel, never around them, and having defense in place puts you ahead of most people I talk to. One question though: your lawyer is defending the case. Has anyone sat down with you and shown what happens to your equity when the defense runs out?", "Defense buys time; it doesn't decide what you do with the time. Meanwhile the bank's fees and daily interest run against your equity every month the case drags. Your attorney is playing defense — but nobody's playing offense on your money. What if the judge rules against you at the next hearing and you've got weeks, not months — is there a plan for that day, or just the appeal? Five free minutes with a senior advisor, 30-plus years, coordinated with your lawyer, no fees ever. If your counsel says we're not needed, we shake hands and part friends."], "one": "Your lawyer is playing defense — nobody is playing offense on your equity while the meter runs.", "es": {"say": "Mi abogado se está encargando. Hable con él, no conmigo.", "reb": ["Quédese con su abogado — en serio, nosotros trabajamos CON los abogados, nunca por encima de ellos, y tener defensa puesta lo pone por delante de la mayoría de la gente con la que hablo. Una pregunta nada más: su abogado está defendiendo el caso. ¿Alguien se ha sentado con usted a mostrarle qué pasa con su equidad cuando la defensa se acabe?", "La defensa compra tiempo; no decide qué hace usted con ese tiempo. Mientras tanto los honorarios del banco y los intereses diarios corren contra su equidad cada mes que el caso se alarga. Su abogado juega a la defensa, pero nadie está jugando a la ofensiva con su dinero. ¿Y si el juez falla en contra en la próxima audiencia y le quedan semanas y no meses — hay un plan para ese día, o solamente la apelación? Cinco minutos gratis con nuestro asesor principal, más de treinta años en esto, coordinado con su abogado, sin honorarios nunca. Si su abogado dice que no hacemos falta, nos damos la mano y quedamos como amigos."], "one": "Su abogado juega a la defensa — nadie está jugando a la ofensiva con su equidad mientras el reloj corre."}}, {"n": 3, "t": "The Postponement Gambler", "say": "That sale date doesn't mean anything. It's been cancelled twice already. It always gets pushed.", "reb": ["You're right that sales get reset — you've lived it twice, so I'm not going to tell you deadlines never move. But let me ask: do you know WHY those two got pushed? Because each cancellation had a reason — a review, a motion — and those reasons run out.", "And here's the part nobody mentions: every push was billed to you. Post-judgment interest runs daily — call it $70-plus a day on a $300k judgment — plus new attorney fees each reset, all coming out of your equity. When one finally holds, the certificate of title can issue about ten days after the auction, and every option collapses to zero. It's the hurricane that turned away twice — the third one doesn't care about your track record. What if this is the date that sticks and you've got ten days? Having the plan ready costs you nothing — free, no fees, no commitment. If it pushes again, we've lost nothing and we part friends."], "one": "Every postponement was billed to your equity at $70 a day — and the hurricane that turned twice doesn't care about your track record.", "es": {"say": "Esa fecha de subasta no significa nada. Ya la cancelaron dos veces. Siempre la empujan.", "reb": ["Tiene razón en que las subastas se posponen — usted lo ha vivido dos veces, así que no le voy a decir que las fechas nunca se mueven. Pero déjeme preguntarle: ¿sabe POR QUÉ se pospusieron esas dos? Porque cada cancelación tuvo un motivo — una revisión, una moción — y esos motivos se agotan.", "Y esta es la parte que nadie menciona: cada posposición se la cobraron a usted. El interés después del fallo corre a diario — ponga setenta dólares o más por día sobre un fallo de trescientos mil — más honorarios nuevos de abogado en cada reprogramación, todo saliendo de su equidad. Cuando una por fin se sostiene, el certificado de título puede salir unos diez días después de la subasta, y ahí todas las opciones se van a cero. Es el huracán que se desvió dos veces: el tercero no sabe de su historial. ¿Y si esta es la fecha que se queda y le quedan diez días? Tener el plan listo no le cuesta nada — gratis, sin honorarios, sin compromiso. Si se pospone otra vez, no perdimos nada y quedamos como amigos."], "one": "Cada posposición se la cobraron a su equidad a setenta dólares por día — y el huracán que se desvió dos veces no sabe de su historial."}}, {"n": 4, "t": "The Incoming Check", "say": "I'm waiting on my tax refund and a settlement check. Once that comes in, I'll catch everything up.", "reb": ["Money on the way is a real asset — I'm not dismissing it. Let me isolate one thing: if that check clears before the sale date, you're fine. So the only question is what happens if it doesn't. Fair?", "Here's the problem: your check runs on the IRS's clock or an insurance adjuster's clock — no deadline, slips for months, can get offset. The foreclosure runs on a court clock with a judge attached. You're racing a train to the crossing, and only one of you has a schedule. And remember, the payoff grows daily while you wait, so the check has to beat the clock AND cover a bigger number. What if it lands two weeks after the sale? At that point the money arrives and the house is already gone — after the sale it can't buy it back. Let's map the backup for free, no fees ever. If the check wins the race, use it and we part friends."], "one": "Your check runs on the IRS's clock; the foreclosure runs on a judge's clock — only one of those has a schedule.", "es": {"say": "Estoy esperando mi reembolso de impuestos y un cheque de un acuerdo. Cuando entre, pongo todo al día.", "reb": ["Dinero en camino es un activo real — no se lo estoy quitando. Déjeme aislar una sola cosa: si ese cheque entra antes de la fecha de la subasta, usted está bien. Entonces la única pregunta es qué pasa si no entra. ¿Le parece justo?", "El problema es este: su cheque corre en el reloj del IRS o en el reloj de un ajustador de seguros — sin fecha límite, se atrasa meses, y hasta se lo pueden descontar. La ejecución corre en el reloj de la corte, con un juez y una fecha. Solamente uno de esos dos relojes tiene horario. ¿Y si el cheque entra tres semanas después de la subasta? Cinco minutos gratis y tiene un plan B que no le cuesta nada tener guardado. ¿No le parece?"], "one": "Su cheque corre en el reloj del IRS; la ejecución corre en el reloj del juez — solamente uno de los dos tiene horario."}}, {"n": 5, "t": "The Family Money", "say": "My brother is lending me the money. We're handling it inside the family.", "reb": ["That's the best kind of help — family money with no strings. One question: is the only thing standing between you and fixing this the money arriving, or has anyone actually pulled the exact reinstatement figure from the bank yet?", "Here's the trap: that number isn't your missed payments. It's payments plus late fees plus the bank's attorney fees plus daily interest — on a $300k judgment that's roughly $70 to $80 a day — and the quote itself takes the bank 5 to 10 business days to issue and then expires. It's like a flight: being at the airport doesn't matter if the doors close before you're in the seat. What if the real number comes back $10k higher than your brother planned for, two weeks before the sale? Let's get the real figure and a backup option on paper — free, no fees ever. If your brother's wire clears in time, we shake hands and part friends."], "one": "The reinstatement number isn't your missed payments — it's payments plus fees plus $70 a day, and the quote takes the bank a week just to issue.", "es": {"say": "Mi hermano me está prestando el dinero. Lo estamos resolviendo en familia.", "reb": ["Esa es la mejor ayuda que hay — dinero de familia y sin condiciones. Una pregunta: ¿lo único que falta entre usted y arreglar esto es que llegue el dinero, o alguien ya pidió la cifra exacta de reinstalación por escrito al banco?", "Aquí está la trampa: esa cifra no son sus pagos atrasados. Son los pagos, más los cargos por mora, más los honorarios del abogado del banco, más el interés diario — sobre un fallo de trescientos mil, unos setenta u ochenta dólares por día. Es como pedir el precio del pasaje una semana antes de volar: el número que usted tiene en la cabeza no es el número de hoy. Y la carta oficial con esa cifra el banco se demora una semana o más en darla. ¿Y si el dinero de su hermano alcanza para el número viejo pero no para el nuevo? Cinco minutos gratis con nuestro asesor principal y usted sabe la cifra real antes de pedirle nada a su familia. ¿Verdad que sí?"], "one": "La cifra de reinstalación no son sus pagos atrasados — son pagos más cargos más setenta dólares diarios, y el banco se demora una semana en darle esa carta."}}, {"n": 6, "t": "The Bankruptcy Pause Button", "say": "My lawyer is filing bankruptcy. That stops all of this, so there's nothing to talk about.", "reb": ["Smart move to have that option ready — the automatic stay is real and it does pause the sale. Just so I understand: if the bankruptcy only pauses this instead of ending it, would it be worth five minutes to know what happens on the other side?", "Bankruptcy is a pause button, not an eraser. The lender typically files a motion for relief from stay, and those get heard in 30 to 60 days — then the clock restarts exactly where it stopped, with the arrears still owed. In a Chapter 13 you're paying the full arrears back on top of the regular payment. It's like pausing a movie: when you hit play, you're at the same scene. What if the stay lifts in 45 days — do you want your equity options mapped before or after that? Free consult, no fee ever. If the plan holds, great — we part friends."], "one": "Bankruptcy is a pause button, not an eraser — when the stay lifts, you're at the same scene with the same arrears.", "es": {"say": "Mi abogado va a radicar bancarrota. Eso detiene todo esto, así que no hay nada de qué hablar.", "reb": ["Bien pensado tener esa opción lista — la parada automática es real y sí detiene la subasta. Nada más para entenderlo bien: si la bancarrota solamente pausa esto en vez de terminarlo, ¿valdrían cinco minutos saber qué pasa el día que se levante la pausa?", "La bancarrota es un botón de pausa, no un borrador. El prestamista normalmente radica una moción para levantar la parada, y esas se ven en treinta a sesenta días — y ahí el reloj arranca exactamente donde se quedó, con los mismos atrasos y ahora con honorarios nuevos encima. Es pausar la película: cuando le da play, la escena sigue igualita. ¿Y si le levantan la parada en cuarenta días y usted no tiene nada preparado para ese día? La consulta es gratis y no interfiere con su abogado. ¿No le parece justo?"], "one": "La bancarrota es un botón de pausa, no un borrador — cuando se levanta la parada usted está en la misma escena y con los mismos atrasos."}}, {"n": 7, "t": "The Scam Fatigue Wall", "say": "I already talked to three of you people. You all want the same thing. Get off my porch.", "reb": ["Honestly? You should be suspicious — most of the people knocking want to buy your house cheap, today, with a contract in their hand. Let me ask you straight: if I'm not here to buy your house and there's nothing to sign, is there another reason not to talk?", "We start with a free consultation with a senior advisor — 30-plus years doing this — and we lay out three to five options, including ones where you keep the house: refinance, modification through counsel, selling with your equity. No fees, ever, by law and by policy. Three bad mechanics doesn't mean the engine fixes itself. What if the fourth conversation is the one where someone finally shows you the option that protects your equity instead of taking it? Five minutes, nothing to sign. Worst case, we shake hands and part friends — that's the actual deal."], "one": "Three bad mechanics doesn't mean the engine fixes itself — and I'm not here with a contract.", "es": {"say": "Ya hablé con tres de ustedes. Todos quieren lo mismo. Váyase de mi puerta.", "reb": ["¿Honestamente? Usted debería desconfiar — la mayoría de los que tocan quieren comprarle la casa barata, hoy, con un contrato en la mano. Se lo pregunto directo: si yo no vengo a comprarle la casa y no le voy a pedir ni una firma ni un centavo hoy, ¿hay alguna otra razón para no escuchar dos minutos?", "Nosotros empezamos con una consulta gratis con nuestro asesor principal — más de treinta años haciendo esto — y le ponemos sobre la mesa de tres a cinco opciones, incluyendo las que le dejan la casa. Nunca le cobramos un centavo por adelantado, y eso no es un favor, es la ley. Tres mecánicos malos no quieren decir que el motor se arregla solo. ¿Y si en cinco minutos le señalamos algo que ninguno de esos tres vio? Usted no pierde nada — ¿verdad?"], "one": "Tres mecánicos malos no quieren decir que el motor se arregla solo — y yo no vengo con un contrato."}}, {"n": 8, "t": "The Wrong House (Denial)", "say": "You've got the wrong house. We're not in any foreclosure.", "reb": ["I hope I do have the wrong house — honestly, that would be the best news of my day. Can I ask you one thing, though, just so I can leave you in peace: if a case had been filed at the courthouse under this address, would you want to be the first to know, or the last?", "Because a filing isn't a verdict on you — it's a clock, and the people who look at it early are the ones who keep choices. It's like a lab result sitting in a drawer: reading it doesn't make you sick, it tells you what's treatable. What if five free minutes with an advisor who's done this for thirty years showed you three or four ways this ends on your terms? If nothing's filed, wonderful — we shake hands and part friends. Is it fair to at least look together?"], "one": "If something had been filed under this address, would you rather be the first to know or the last?", "es": {"say": "Usted tiene la casa equivocada. Aquí no hay ninguna ejecución.", "reb": ["Ojalá tenga la casa equivocada — de verdad, sería la mejor noticia de mi día. ¿Le puedo preguntar una sola cosa, nada más para dejarlo tranquilo? Si se hubiera radicado un caso en la corte con esta dirección, ¿usted querría saberlo, o preferiría que no le dijera nada?", "Porque un caso radicado no es un veredicto sobre usted — es un reloj, y los que lo miran temprano son los que se quedan con opciones. Es como un resultado de laboratorio guardado en una gaveta: leerlo no lo enferma, y no leerlo no lo cura. ¿Y si le doy el número del caso y usted mismo lo verifica en el récord de la corte, sin hablar conmigo nunca más? No le cuesta nada y queda tranquilo de una forma u otra. ¿No le parece?"], "one": "Si se hubiera radicado algo bajo esta dirección, ¿preferiría ser el primero en enterarse o el último?"}}, {"n": 9, "t": "It's Too Late (Hopelessness)", "say": "There's a sale date already. It's over — there's nothing anybody can do now.", "reb": ["I hear you — and after months of this, being tired makes all the sense in the world. But let me ask just one thing: is it that nothing can be done, or that you're done? Those are two different things, and only one of them is true.", "A sale date is a deadline, not a verdict — sales get postponed, cases get reworked, and even on the hardest path there's a world of difference between walking out with cash for your keys and time to land, versus being put out with nothing. It's like the two-minute warning in a game: that's not when you leave the stadium, that's when the plays matter most. What if the last ten minutes you spend on this house are the ones that decide how your family walks out of it? You've fought this long — isn't it fair to yourself to hear what's still on the table?"], "one": "A sale date is a deadline, not a verdict — and the last ten minutes are when the plays matter most.", "es": {"say": "Ya hay fecha de subasta. Se acabó, ya no hay nada que nadie pueda hacer.", "reb": ["Lo escucho — y después de meses con esto, estar cansado tiene todo el sentido del mundo. Pero déjeme preguntarle una sola cosa: ¿es que no se puede hacer nada, o es que usted ya no puede más? Porque esas son dos cosas distintas.", "Una fecha de subasta es una fecha límite, no un veredicto — las subastas se posponen, los casos se reestructuran, y hasta en el camino más duro hay una diferencia enorme entre salir con dinero en la mano y salir sin nada. Es el partido en el último minuto: ahí es cuando las jugadas importan más, no menos. ¿Y si en cinco minutos gratis nuestro asesor principal le muestra una jugada que todavía queda? Si no queda ninguna, se lo decimos de frente y quedamos como amigos."], "one": "Una fecha de subasta es una fecha límite, no un veredicto — y los últimos diez minutos son cuando las jugadas más importan."}}, {"n": 10, "t": "She Doesn't Know (Family Secret)", "say": "My wife doesn't know how bad it is. You have to go before she comes out here.", "reb": ["I'll step back — and I want you to know I understand why you've carried this alone; you were trying to protect her. One quiet question before I go: would you rather she hear it from you, with a plan in your hand — or from a notice taped to the door?", "Because a secret like this has a deadline, and the court sets it, not you. Telling her with options is like a pilot announcing turbulence along with the route around it — scary for a second, then everyone breathes. Telling her at the end is the crash landing. What if ten free, private minutes — just you and an advisor, before any conversation at home — gave you the words and the plan to bring to her? Isn't it fair that when she finds out, she finds out you were already fighting for her?"], "one": "She's going to find out — the only choice left is whether she hears it from you with a plan, or from a notice on the door.", "es": {"say": "Mi esposa no sabe lo mal que está esto. Tiene que irse antes de que ella salga.", "reb": ["Me hago para atrás — y quiero que sepa que entiendo por qué ha cargado esto solo; usted la estaba protegiendo. Una pregunta tranquila antes de irme: ¿preferiría que ella lo escuche de usted, con un plan en la mano, o de un papel pegado en la puerta?", "Porque un secreto así tiene fecha de vencimiento, y la pone la corte, no usted. Decírselo con opciones es como el piloto que anuncia la turbulencia junto con la ruta para esquivarla: da miedo un segundo y después todo el mundo respira. Decírselo al final es el aterrizaje de emergencia. ¿Y si cinco minutos gratis y privados — usted y el asesor, antes de cualquier conversación en la casa — le dieran las palabras y el plan para llevárselo a ella? ¿No es justo que cuando ella se entere, se entere de que usted ya estaba peleando por ella?"], "one": "Ella se va a enterar — lo único que queda por decidir es si lo escucha de usted con un plan, o de un aviso en la puerta."}}, {"n": 11, "t": "Worn Out — \"Just take it, I'm done\"", "say": "Honestly I'm fed up. I'm worn out. I don't think I can afford this even if a miracle came down from heaven. I'd be better off walking away from all this stress.", "reb": ["I hear you, and the majority of people we speak to hit that exact wall — they just want to get away from all the problems, and that's fair. Everybody gets there at some point. Let me ask you one thing: what is it that you TRULY want to do with this property?", "If you've truly had it, then rather than the bank taking the house AND whatever equity you have, I'm sure you'd rather walk out with cash in your pocket, on your own timeline, with dignity — instead of a sheriff putting your things on the street on a date you don't control. We have a program for exactly this — Cash for Keys. We agree on a set figure; you get half the money up front when we sign, and you pick your exit window: 30, 60 or 90 days. The longer you stay the number adjusts a little — not a lot — because our money sits parked. At the end you hand over the keys, the house is clear of your personal things, and you receive the other half that same day. You pick the date. You pick the time. You run the show.", "Let me review the file — what's owed, what it's worth, what condition it's in — and give me fifteen, twenty minutes. I'll come back with a real figure, and if it makes sense to both of us I'll have one of our people at your door and cash moving today."], "one": "Walk out with cash and a date YOU picked — or let the sheriff pick it for you.", "es": {"say": "Sinceramente estoy agotado. No puedo con esto ni aunque bajara un milagro del cielo. Mejor lo dejo todo.", "reb": ["Lo entiendo, y la mayoria de las personas con las que hablamos llegan a ese mismo punto — quieren alejarse de todos los problemas, y es justo. Dejeme preguntarle una sola cosa: que es lo que usted VERDADERAMENTE quiere hacer con esta propiedad?", "Si de verdad ya no puede mas, en vez de que el banco se quede con la casa Y con su plusvalia, mejor salga con dinero en el bolsillo, en su propia fecha, con dignidad — y no con el sheriff poniendo sus cosas en la calle un dia que usted no controla. Tenemos un programa exactamente para esto — Cash for Keys. Acordamos una cifra; le damos la MITAD por adelantado al firmar, y usted escoge su plazo: 30, 60 o 90 dias. Al final entrega las llaves, la casa queda libre de sus cosas personales, y recibe la otra mitad ese mismo dia. Usted escoge la fecha. Usted manda.", "Deme quince o veinte minutos para revisar el expediente — lo que se debe, lo que vale — y regreso con una cifra real. Si nos hace sentido a los dos, hoy mismo movemos el dinero."], "one": "Salga con dinero y una fecha que USTED escogio — o deje que el sheriff la escoja."}}, {"n": 12, "t": "The Overpriced Listing (Realtor gatekeeper)", "say": "The agent has it listed at $429k with ten days to the sale, zero showings — and shields the owner from every call.", "reb": ["I'm not here to point fingers — whether the 429 was your idea or your client's, I honestly don't care. I'm here to stop a foreclosure, make this work for your client, make it work for you, and maybe for one of my investors. But the first thing we all have to do is take a big bite of reality pie on that price with a sale date ten days out.", "Here's the good part for you: if we work together and my investor buys it, you keep the FULL commission on this sale — I'll hand my side to you. And when we resell it after the work, you get the listing AGAIN. The same property pays you twice, and nobody else calling on this file is offering you that. Now — your client needs to hear the truth about the number. If you want backup, I'll do it with you on the line. If you'd rather I call him independently, I will. Or you handle it yourself. Any of the three works, but one of them happens this week."], "one": "Same property, two commissions — but only if the price meets reality this week.", "es": {"say": "El agente lo tiene listado en $429 mil, a diez dias de la subasta, sin visitas — y no deja pasar ninguna llamada al dueno.", "reb": ["No vengo a senalar culpables — si el precio fue idea suya o de su cliente, sinceramente no me importa. Vengo a detener una ejecucion, a que esto funcione para su cliente, para usted, y quizas para uno de mis inversionistas. Pero lo primero es aceptar la realidad de ese precio con una subasta a diez dias.", "Y esto es lo bueno para usted: si trabajamos juntos y mi inversionista compra, usted se queda con la comision COMPLETA de esta venta — yo le cedo mi parte. Y cuando la revendamos despues del trabajo, usted vuelve a tener el listing. La misma propiedad le paga dos veces, y nadie mas en este expediente le esta ofreciendo eso. Ahora — su cliente necesita oir la verdad del numero. Si quiere respaldo, lo hago con usted en la linea; si prefiere, lo llamo yo aparte; o lo maneja usted solo. Cualquiera de las tres funciona, pero una de las tres pasa esta semana."], "one": "La misma propiedad, dos comisiones — si el precio acepta la realidad esta semana."}}, {"n": 13, "t": "The Parachute Frame (universal — any rescue plan they believe in)", "say": "I've got it handled — the bank's reviewing my modification / my money arrives tomorrow / my cousin is wiring it.” Any plan they're emotionally invested in, 7–10 days out.", "reb": ["I'm applauding you — you did the right thing, and I commend you for getting the ball rolling. Keep doing exactly what you're doing. One question, though: do you have the approval in writing? Because a lot of banks drag the review out and deny two or three days before the sale — and the denial can go straight to their attorneys without you ever seeing it. As much as neither of us wants to look at it, you'd agree that's a real possibility, right?", "So here's what I'm proposing — I don't want to be your bank, and I don't want to be your middleman. I want to be your parachute. You're betting your house on that plan landing on time; let us work on postponing the sale in parallel, so if the money or the approval comes a day late, the extra time is already in motion and your plan still saves the house. If your plan works, beautiful — I did you a favor and you owe me one. And the no-cost version: give me a third-party authorization — just permission to speak to your bank, nothing else, no fees — I'll make one courtesy call and get the bottom line on where your file really is. Based on that, we decide if we work together at all. Fair?"], "one": "You're betting your house on the timing — keep the plan, and let me be the parachute.", "es": {"say": "Ya lo tengo resuelto — el banco esta revisando mi modificacion / el dinero me llega manana / mi primo me lo manda.", "reb": ["Lo felicito — hizo lo correcto, y le aplaudo que haya puesto la bola en movimiento. Siga haciendo exactamente lo que esta haciendo. Una pregunta nada mas: tiene la aprobacion por escrito? Porque muchos bancos alargan la revision y niegan dos o tres dias antes de la subasta — y la negacion puede irse directo a sus abogados sin que usted la vea. Por mucho que no queramos mirarlo, usted estaria de acuerdo en que esa posibilidad existe, verdad?", "Entonces esto es lo que le propongo — yo no quiero ser su banco, ni su intermediario. Quiero ser su paracaidas. Usted esta apostando su casa a que ese plan llegue a tiempo; dejenos trabajar el aplazamiento de la venta en paralelo, para que si el dinero o la aprobacion llega un dia tarde, la subasta ya este detenida y su plan todavia salve la casa. Si su plan funciona, perfecto — le hice un favor y me debe uno. Y la version sin costo: deme una autorizacion de tercero — solo permiso para hablar con su banco, nada mas, sin honorarios — hago una llamada de cortesia y le traigo la verdad de donde esta su expediente. Con eso decidimos si trabajamos juntos o no. Justo?"], "one": "Usted esta apostando su casa al calendario — quedese con su plan, y dejeme ser el paracaidas."}}, {"n": 14, "t": "CLOSE — Save My Number (the read-back test)", "say": "Nothing — this is YOUR move at the end of any call that went well, before you hang up.", "reb": ["Do me one favor before we hang up. I've invested my time, and I'm going to keep investing it after this call — so save my number right now. My name is Jesse. The company is Miami Solutions Group. This is my personal cell, and let me give you the office number too. Now read it all back to me — I want to make sure you got everything right.", "If they read it back clean, they're in. If \"my pen ran out of ink\" or they ask you to repeat it, they're tepid — tighten the follow-up and don't count the deal. Same muscle, bigger size: the paperwork trial close. \"Let me get the paperwork together — I'll email it, we go over it, and if we agree we shake hands. If not, I wasted fifteen minutes of my time and we part friends. Nothing gambled on your part. Sound fair?\" Their reaction to concrete paperwork IS the temperature reading. And when they're warm but need authority: \"Just get on the phone with our senior advisor for five minutes and we'll find a solution for this property.\""], "one": "If they read it back clean they're in — if the pen 'ran out of ink,' they're not.", "es": {"say": "Nada — este es SU movimiento al final de toda llamada que fue bien, antes de colgar.", "reb": ["Hagame un favor antes de colgar. Yo he invertido mi tiempo y voy a seguir invirtiendolo despues de esta llamada — asi que guarde mi numero ahora mismo. Mi nombre es Jesse. La compania es Biscayne Solutions Group. Este es mi celular personal, y le doy tambien el de la oficina. Ahora leamelo todo de vuelta — quiero asegurarme de que lo tiene bien.", "Si lo lee de vuelta completo, esta DENTRO. Si \"se le acabo la tinta\" o le pide que se lo repita, esta tibio — apriete el seguimiento y no cuente el negocio. El mismo musculo en tamano grande: el cierre de papeleria. \"Dejeme preparar los papeles — se los mando por correo, los repasamos, y si estamos de acuerdo nos damos la mano. Si no, perdi quince minutos de mi tiempo y quedamos como amigos. Usted no arriesga nada. Le parece justo?\" Y cuando estan tibios pero necesitan autoridad: \"Pongase al telefono con nuestro asesor principal cinco minutos y le encontramos una solucion a esta propiedad.\""], "one": "Si lo lee de vuelta completo esta dentro — si \"se acabo la tinta\", no lo esta."}}, {"n": 15, "t": "Not Interested (The Reflex Brush-Off)", "say": "I'm not interested.", "reb": ["That's not a problem at all — honestly, I wasn't expecting you to be. Almost everybody I reach about a place like yours says the exact same thing when I first call, so you're in good company. I'm not here to sign you up for anything, and I'm not calling to buy the house. Real quick though, just so I'm not the twelfth person wasting your afternoon — has anybody actually sat down and shown you what happens to your balance every time that sale date gets pushed... or is that still kind of a question mark for you?", "Because that's the only reason I called — not to pitch you a loan. Our senior advisor, 30-plus years in mortgages and foreclosure workouts, just lays your real options out in about five minutes, free, and you decide what to do with them. Worst case, you know more than you did this morning, and we part friends. That's fair, right?"], "one": "I'm not asking you to be interested — I'm asking if it's worth five free minutes to know your options before that date hits.", "es": {"say": "No estoy interesado.", "reb": ["No hay ningún problema — la verdad, ni esperaba que lo estuviera. Casi todas las personas con las que hablo sobre una casa como la suya me dicen exactamente lo mismo cuando llamo la primera vez, así que está en buena compañía. No le vengo a inscribir en nada, y no le llamo para comprarle la casa. Rapidito, nada más para no ser la persona número doce que le quita la tarde: ¿alguien ya se sentó con usted y le mostró qué le pasa a su saldo cada vez que empujan esa fecha de la subasta... o eso todavía es una interrogante?", "Porque esa es la única razón por la que llamé — no para venderle un préstamo. Nuestro asesor principal, más de 30 años en hipotecas y en resolver casos de ejecución, le pone sus opciones reales sobre la mesa en unos cinco minutos, gratis, y usted decide qué hacer con ellas. En el peor de los casos, sabe más de lo que sabía esta mañana, y quedamos como amigos. ¿Verdad que sí?"], "one": "No le pido que esté interesado — le pregunto si vale cinco minutos gratis conocer sus opciones antes de que llegue esa fecha."}}, {"n": 16, "t": "Wrong Number (+ Instant Hang-Up)", "say": "You've got the wrong number.  [click]", "reb": ["Oh — my apologies, I may have dialed wrong. One quick second so I'm not bothering the wrong person: I'm just trying to reach the owner of the property on my paperwork here... that's not you, is it?", "If it's honestly not you — no problem at all, I'll let you go, sorry to have bothered you. But if it IS your place, this is worth thirty seconds: I've got county paperwork on it, and the people who look at it early are the ones who keep their choices. Five free minutes with an advisor who's done this thirty years — and if it turns out to be nothing, we part as friends. Fair enough?"], "one": "Sorry — I think I may have dialed wrong. I'm just trying to reach the owner of the property on my paperwork... that's not you, is it?", "es": {"say": "Tiene el número equivocado.  [cuelga]", "reb": ["Ay — disculpe, capaz marqué mal. Un segundito para no estar molestando a la persona equivocada: nada más estoy tratando de localizar al dueño de la propiedad que tengo aquí en mi papeleo... ¿ese no es usted, verdad?", "Si de verdad no es usted — no hay ningún problema, lo dejo ir, disculpe la molestia. Pero si SÍ es su propiedad, esto vale treinta segundos: tengo papeleo del condado sobre ella, y las personas que lo revisan temprano son las que se quedan con opciones. Cinco minutos gratis con un asesor que lleva treinta años en esto — y si resulta no ser nada, quedamos como amigos. ¿Le parece justo?"], "one": "Disculpe — creo que marqué mal. Nada más busco al dueño de la propiedad que tengo en mi papeleo... ¿ese no es usted, verdad?"}}], "bal": {"op": {"en": "Hi{first}, this is {sender} with Biscayne Solutions Group. I'm calling about the hard-money note on {st1}. Quick question: are you planning to extend it with the same lender, or refinance it?", "es": "Hola{first}, le habla {sender} de Biscayne Solutions Group. Le llamo por el préstamo privado sobre {st1}. Pregunta rápida: ¿piensa extenderlo con el mismo prestamista, o refinanciarlo?", "aen": "Hi, this is {sender} with Biscayne Solutions Group. I'm trying to reach whoever handles the financing on {st1}. Who would that be?", "aes": "Hola, le habla {sender} de Biscayne Solutions Group. Busco a la persona que maneja el financiamiento de {st1}. ¿Quién sería?", "wen": "Hi{first}, {sender} again from Biscayne Solutions Group. Did you get a minute to look at the note on {st1}?", "wes": "Hola{first}, {sender} otra vez de Biscayne Solutions Group. ¿Tuvo un momento para ver lo del préstamo sobre {st1}?"}, "q": [{"k": "THE RATE", "w": "Get the number out of their mouth. Twelve is the usual answer.", "en": "What are you paying on it right now, roughly?", "es": "¿Más o menos qué tasa está pagando ahora?"}, {"k": "THE WALL", "w": "The maturity is the clock. Our 24-month date is a proxy; theirs is real.", "en": "And when does it come due?", "es": "¿Y cuándo vence?"}, {"k": "THE PLAN", "w": "Extension at the same rate is the default. Name it so they hear it.", "en": "Were you just going to extend with them at the same rate?", "es": "¿Iba a extenderlo con ellos a la misma tasa?"}, {"k": "THE MATH", "w": "Say THEIR number, from the card. Not the $400k example.", "en": "On that balance the gap between twelve and seven is about {gap} a month. That's what the extension costs you.", "es": "Con ese saldo, la diferencia entre doce y siete es como {gap} al mes. Eso es lo que le cuesta la extensión."}, {"k": "THE ASK", "w": "Fifteen minutes. Not five. An investor at $400k expects a real conversation.", "en": "Give me fifteen minutes to price it. If I can't beat what you've got, I'll tell you in the first five and you've lost nothing.", "es": "Deme quince minutos para cotizarlo. Si no puedo mejorar lo que tiene, se lo digo en los primeros cinco y no perdió nada."}], "cioc": [["DSCR", "The product. Rent qualifies the loan, not their W-2.", "DSCR loans, six to eight percent, seventy to eighty LTV. No tax returns, no personal income docs. The property's rent qualifies it. About two weeks to close."], ["HARD EQUITY", "When speed beats price.", "If you need it faster than that, hard equity at sixty to seventy LTV funds in five to ten business days. Three to five points, ten to twelve percent, but it closes."], ["WORST CASE", "The close. Take the risk off the table.", "Worst case I confirm you already have the best deal available, and you extend with confidence. That's fair, right?"]], "f15": "{sender}, Biscayne Solutions Group. You're paying twelve on {st1}; I can likely get you seven. Fifteen minutes to price it, no commitment. {phone}.", "mars": "B2B, unregulated pitch: a business talking to a business about a rate. No rescue framing, no homeowner disclaimers — but every number you quote is a program RANGE from the sheet, never a promise on THEIR file until it is priced.", "never": ["Never quote a rate as a promise. \"Six to eight\" is a program range; their number comes after pricing.", "Never state the maturity date as fact. Ours is origin + 24 months. Ask theirs.", "Never pitch the LLC. Pitch the human on the card; if that is not the decision-maker, get the name.", "Never run the foreclosure script. There is no sale, no plaintiff, no equity rescue here."], "obj": [{"t": "I'll just extend", "w": "The default. Price the cost of the default.", "s": "Sure, and most people do. It costs about {gap} a month more than it has to. Let me at least put a number next to it before you sign the extension."}, {"t": "Rate is fine", "w": "Nobody thinks 12 is fine. They think the hassle is not worth it.", "s": "Fair. Then this is a fifteen-minute call that ends with you knowing you have the best deal. That's worth fifteen minutes."}, {"t": "Send me something", "w": "Brush-off. Trade it for a time.", "s": "Happy to. It'll be more useful once I know your balance and maturity. What's a good time tomorrow for ten minutes?"}, {"t": "Who are you", "w": "Identity, straight.", "s": "{sender}, Biscayne Solutions Group, Miami. We place DSCR and hard-equity loans on investment property. Your note on {st1} is public record; that's how I found you."}], "vm": {"en": "Hi{first}, this is {sender} with Biscayne Solutions Group, about the hard-money note on {st1}. If you're paying twelve on it, I can likely get you seven. Fifteen minutes to price it, no commitment, and if I can't beat it I'll say so. {phone}. Thanks.", "es": "Hola{first}, le habla {sender} de Biscayne Solutions Group, por el préstamo privado sobre {st1}. Si está pagando doce, probablemente le consigo siete. Quince minutos para cotizarlo, sin compromiso, y si no lo mejoro se lo digo. {phone}. Gracias."}, "rec": null}, "rec": null}, ciocIdx=-1, objIdx=-1;
var SCRIPT_ALL=SCRIPT;   /* the full payload; renderSheet shadows SCRIPT per lane (homeowner vs SCRIPT_ALL.bal) */
function sheetToggle(){ $('sheet').classList.toggle('open'); }

/* ONE LANGUAGE AT A TIME. Every script block used to render EN and ES stacked — on the call screen
   that stacked the opener twice, the close cue, the drawer peek and (on voicemail) two more blocks:
   his words, "too many transcripts, keep one on the screen." The board's both-languages instinct
   was right for a LIST you scan; on a phone mid-call it is double the reading at the worst moment.
   The chosen language persists (fcLang); the other is ONE tap away on the EN|ES chips. */
function lang(){ try{ return localStorage.getItem('fcLang')==='es' ? 'es' : 'en'; }catch(e){ return 'en'; } }
function setLang(v){
  try{ localStorage.setItem('fcLang', v); }catch(e){}
  // repaint whichever script surfaces are up, without touching flow state.
  if(SCREEN==='outcome' && cur){ screenOutcome(); }
  else if(SCREEN==='lead' && cur){ screenLead(); }
  /* The after-call panel too — its text templates are bilingual now, and a language toggle that
     left the old body on screen would send the wrong language. Rebuilt from its own saved args;
     repainting resets the chip selection to the default, which is the safe direction. */
  else if(SCREEN==='after' && _lastAfter){ afterCall(_lastAfter[0], _lastAfter[1], _lastAfter[2]); }
  if(cur) renderSheet(cur);
}
function langChips(){
  var L=lang();
  return '<span class="lchips"><button class="lchip'+(L==='en'?' on':'')+'" data-lang="en">EN</button>'
       + '<button class="lchip'+(L==='es'?' on':'')+'" data-lang="es">ES</button></span>';
}
function wireLang(root){
  Array.prototype.forEach.call((root||document).querySelectorAll('.lchip'), function(b){
    b.onclick=function(ev){ ev.stopPropagation(); setLang(b.dataset.lang); };
  });
}
function say(en, es, r){
  if(lang()==='es' && es) return '<div class="say es">'+esc(fillScript(es, r))+'</div>';
  return '<div class="say">'+esc(fillScript(en, r))+'</div>'
       + (lang()==='es' && !es ? '<div class="noes">No Spanish version of this line yet.</div>' : '');
}

/* ══════════════ GUIDED CALL FLOW (2026-09-15) ══════════════
   One line at a time: the line -> TONE -> LISTEN -> tap what they said -> it routes you, opener to
   booked. A second renderer over the SAME payload (SCRIPT.flow references the constants the full
   sheet renders), never a second vocabulary. Additive GUIDED/FULL toggle; objection cards are detours
   with "continue where I was"; end states press the SAME .oc outcome button the card uses. Any throw
   falls back to the full sheet (logErr). Homeowner lane only (the balloon dict carries no `flow`). */
/* GUIDED is THE view (2026-09-15, Alejandro: "make it the main view"). Default ON; only an explicit
   tap on "view full script" (stored '0') turns it off, and that sticks per device. */
var _g = {on:true, step:'greet', stack:[], ret:null, kase:null};
try{ if(localStorage.getItem('fcGuided')==='0') _g.on=false; }catch(e){}
function _gSave(){ try{ localStorage.setItem('fcGuided', _g.on?'1':'0'); }catch(e){} }
function secondName(r){
  /* (p1b) the co-owner on the card. r.o is "OWNER1; OWNER2"; the county roll may be "LAST,FIRST". */
  try{
    var parts=String((r&&r.o)||'').split(';'); if(parts.length<2) return '';
    var s=parts[1]; if(s.indexOf(',')>=0) s=s.split(',').slice(1).join(' ');
    var tok=s.replace(/[^A-Za-z '-]/g,' ').trim().split(/\s+/)[0]||'';
    if(tok.length<2 || _NOTNAME.indexOf(tok.toUpperCase())>=0) return '';
    return tok.charAt(0).toUpperCase()+tok.slice(1).toLowerCase();
  }catch(e){ return ''; }
}
function _gStep(S,id){ for(var k=0;k<S.flow.length;k++){ if(S.flow[k].id===id) return S.flow[k]; } return null; }
function _gObj(S,n){ for(var k=0;k<S.obj.length;k++){ if(S.obj[k].n===n) return S.obj[k]; } return null; }
function _gBtn(label,to){ return '<button data-gto="'+esc(to)+'">'+esc(label)+'</button>'; }
function _gTone(t){ return t ? '<div class="mut" style="font-size:12px;margin-top:6px"><b style="color:#e7c98a">TONE</b> &middot; '+esc(t)+'</div>' : ''; }
function _gListen(t){
  return '<div style="margin:10px 0 4px;padding:8px 10px;border:1px dashed var(--gold);border-radius:8px;color:var(--gold);font-weight:800;font-size:12px;letter-spacing:.06em">&#9679; LISTEN'
       + (t ? ' &mdash; <span style="font-weight:400;letter-spacing:0;color:#e7c98a">'+esc(t)+'</span>' : '') + '</div>';
}
function renderGuided(r, S, named, warm){
  var b='', st=_g.step, es=(lang()==='es');
  b+='<div class="ltag">GUIDED '+langChips()+' <span class="mut" style="font-weight:400;letter-spacing:0">&middot; step '+(_g.stack.length+1)+'</span></div>';
  /* ---- objection detour */
  if(st.indexOf('obj:')===0){
    var n=+st.slice(4), o=_gObj(S,n), oe=(es&&o&&o.es)?o.es:o;
    b+='<div class="ltag">THEY PUSHED BACK &mdash; '+(o?esc(o.t):'card '+n)+'</div>';
    if(!o){ b+='<div class="noes">This objection card is not in this build. Cushion, isolate, ONE reframe, then continue.</div>'; }
    else{
      b+='<div class="mut" style="font-size:12px;margin-top:6px">They say: &ldquo;'+esc(oe.say)+'&rdquo;</div>';
      b+=_gTone('Cushion FIRST — agree, normalize ("most people I talk to say the same"). Then ONE reframe. Never argue. Voice down.');
      oe.reb.forEach(function(p){ b+='<div class="say'+(es&&o.es?' es':'')+'">'+esc(p)+'</div>'; });
      if(oe.one) b+='<div class="ltag">IF YOU ONLY GET ONE SENTENCE</div><div class="say'+(es&&o.es?' es':'')+'">'+esc(oe.one)+'</div>';
    }
    b+=_gListen('Let it land. Do not stack a second reframe.');
    b+='<div class="ltag">THEN</div><div class="objs">'+_gBtn('↩ Continue where I was','ret')+_gBtn('Still pushing back → 15-second out','f15')+_gBtn('Stop calling me','end:dnc')+'</div>';
    b+='<div class="objs" style="margin-top:4px">'+_gBtn('◀ Back','back')+'</div>';
    return b;
  }
  /* ---- end state: log it with the SAME button the card uses */
  if(st.indexOf('end:')===0){
    var k=st.slice(4), oc=null; for(var j=0;j<OUTCOMES.length;j++){ if(OUTCOMES[j].k===k) oc=OUTCOMES[j]; }
    b+='<div class="ltag">CALL OVER &mdash; LOG IT</div><div class="say">'+esc(oc?oc.t:k)+'</div>';
    b+='<div class="mut" style="font-size:12px;margin:6px 0">One tap logs it (the same as the outcome button on the card) and moves you to the next lead.</div>';
    b+='<div class="objs">'+_gBtn('✓ Log: '+(oc?oc.t:k),'log:'+k)+_gBtn('◀ Back','back')+'</div>';
    return b;
  }
  var s=_gStep(S,st); if(!s){ _g.step='greet'; s=_gStep(S,'greet'); }
  if(!s) throw new Error('guided: flow has no greet step');
  var en=s.en, esl=s.es, br=s.br, tone=s.tone, listen=s.listen;
  if(s.id==='greet'){
    if(warm){ en=S.op.wen; esl=S.op.wes; tone='Energy UP on the name — you KNOW this person. Then hand it to them and wait.';
              br=[['Glad to hear from me','frame'],['Not a good time','busy'],['Voicemail','vm']]; }
    else if(!named){ en=s.aen||en; esl=s.aes||esl; }
  }
  b+='<div class="ltag">'+esc(s.k||s.id)+'</div>';
  if(s.id==='greet' && named && !warm){ var sn=secondName(r); if(sn) b+='<div class="noes">Co-owner on the card: <b>'+esc(sn)+'</b> &mdash; if that is who picked up, use their name.</div>'; }
  if(s.rail){
    var rl=(es&&s.rail.es)?s.rail.es:s.rail.en;
    rl.forEach(function(p){ b+='<div class="say'+(es&&s.rail.es?' es':'')+'">'+esc(fillScript(p,r))+'</div>'; });
  } else { b+=say(en, esl, r); }
  b+=_gTone(tone)+_gListen(listen);
  b+='<div class="ltag">THEY SAID&hellip; tap it</div><div class="objs">';
  br.forEach(function(x){ b+=_gBtn(x[0],x[1]); });
  b+='</div><div class="objs" style="margin-top:4px">'+(_g.stack.length?_gBtn('◀ Back','back'):'')+_gBtn('↻ Restart','restart')+'</div>';
  return b;
}
function _gGo(to){
  var S=(cur && cur.st==='BAL' && SCRIPT_ALL.bal)?SCRIPT_ALL.bal:SCRIPT_ALL;
  if(to==='back'){ _g.step=_g.stack.pop()||'greet'; }
  else if(to==='restart'){ _g.step='greet'; _g.stack=[]; _g.ret=null; }
  else if(to==='ret'){ _g.stack.push(_g.step); _g.step=_g.ret||'greet'; _g.ret=null; }
  else if(to.indexOf('log:')===0){
    var k=to.slice(4), btn=document.querySelector('.oc button[data-oc="'+k+'"]');
    if(btn){ btn.click(); } else { toast('Tap the phone number to start the call first — outcomes log from the call screen.'); }
    return;
  } else {
    var here=_gStep(S,_g.step);
    _g.stack.push(_g.step);
    if(to.indexOf('obj:')===0) _g.ret=(here&&here.ret)||_g.step;
    _g.step=to;
  }
  renderSheet(cur);
}
function _gWire(){
  Array.prototype.forEach.call($('sbody').querySelectorAll('[data-gto]'), function(el){ el.onclick=function(){ _gGo(el.dataset.gto); }; });
  Array.prototype.forEach.call($('sbody').querySelectorAll('[data-gmode]'), function(el){ el.onclick=function(){ _g.on=(el.dataset.gmode==='1'); _gSave(); renderSheet(cur); }; });
  wireLang($('sbody'));
}

function renderSheet(r){
  /* BALLOON rows read the investor script (SCRIPT_ALL.bal, from the vault Refi Lane note). Shadowing
     the global with a local of the same name keeps every SCRIPT.* line below untouched — one switch,
     not fourteen edits, and the homeowner script cannot leak onto an investor call. */
  var SCRIPT = (r && r.st==='BAL' && SCRIPT_ALL.bal) ? SCRIPT_ALL.bal : SCRIPT_ALL;
  // Named vs anonymous opener — see firstName(). No usable name means ask for the owner instead of
  // greeting a company, a placeholder, or a name the card just told him not to use.
  var named = !!firstName(r);
  var warm = named && isWarm(r);
  var opEN = warm ? SCRIPT.op.wen : (named ? SCRIPT.op.en : SCRIPT.op.aen);
  var opES = warm ? SCRIPT.op.wes : (named ? SCRIPT.op.es : SCRIPT.op.aes);
  // PEEK — the first thing out of his mouth, plus the close cue, always one glance away.
  var op = fillScript(opEN, r);
  // The peek is the doorway. In GUIDED mode it says so in gold — the first line of the opener plus
  // "tap to start" — so the guided call is impossible to miss (the toggle used to hide in the drawer).
  var _guidedOn = !!(SCRIPT.flow && SCRIPT.flow.length && _g.on);
  $('peek').innerHTML = '<b>'+esc(op.split('.')[0])+'.</b> '
    + (_guidedOn
        ? '<span class="mut">&hellip;</span> <b style="color:var(--gold)">&#9654; TAP TO START THE CALL</b>'
          + '<span class="mut"> &middot; guided, one line at a time</span>'
        : '<span class="mut">&hellip; tap for the full script</span>')
    + '<div class="mut" style="margin-top:4px">Close with: <b>That&rsquo;s fair, right?</b></div>';

  var b = '';
  // GUIDED / FULL toggle + the guided renderer. Homeowner lane only (the balloon dict has no `flow`).
  // Reset to the opener whenever the LEAD changes — never mid-call.
  if(SCRIPT.flow && SCRIPT.flow.length){
    if(r && r.c!==_g.kase){ _g.kase=r.c; _g.step='greet'; _g.stack=[]; _g.ret=null; }
    // GUIDED is the main view: a gold header + a small "view full script" escape hatch. In FULL mode
    // the way back is one big gold button — the full sheet is the secondary view now, not a peer.
    if(_g.on){
      b += '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 6px">'
         + '<b style="color:var(--gold);font-size:13px;letter-spacing:.06em">&#9654; GUIDED CALL</b>'
         + '<button data-gmode="0" style="min-height:36px;padding:0 12px;border-radius:999px;border:1px solid #2a3f6b;background:#0f1d3a;color:var(--mut);font-size:12px;font-weight:700;touch-action:manipulation">view full script</button>'
         + '</div>';
    } else {
      b += '<div class="cioc" style="grid-template-columns:1fr;margin:0 0 8px">'
         + '<button data-gmode="1" class="on">&#9664; BACK TO GUIDED CALL &mdash; one line at a time</button></div>';
    }
    if(_g.on){
      try{
        b += renderGuided(r, SCRIPT, named, warm);
        $('sbody').innerHTML = b;
        _gWire();
        return;
      }catch(e){
        logErr(e,'guided');
        b += '<div class="noes">Guided mode hit an error and fell back to the full script (see the error chip).</div>';
      }
    }
  }
  // TONALITY reference — collapsed by default (one tap), so it trains without pushing the opener down.
  // Homeowner lane only (the balloon dict has no `tone`). Native <details>, no JS state needed.
  if(SCRIPT.tone && SCRIPT.tone.length){
    b += '<details style="margin:0 0 8px;border:1px solid #2a3f6b;border-radius:8px;background:#0f1c38;padding:6px 10px">'
       + '<summary style="cursor:pointer;color:var(--gold);font-weight:700;font-size:12px;letter-spacing:.05em">TONALITY &mdash; how to say all of this (tap)</summary>';
    SCRIPT.tone.forEach(function(t){
      b += '<div style="margin:8px 0;font-size:13px;line-height:1.4"><b style="color:#e7c98a">'
         + esc(t.k) + '</b><br><span class="mut">' + esc(t.v) + '</span></div>';
    });
    b += '</details>';
  }
  b += '<div class="ltag">THE OPENER '+langChips()+'</div>'
        + say(opEN, opES, r)
        + (named ? '' : '<div class="noes">No usable first name on this lead &mdash; ask for the owner rather than guessing at one.</div>');

  // STATUS FRAME (NEPQ) — read straight after the opener, before any question. Lowers the "he's about
  // to pitch me" pressure; their "yes, that'd help" is the first micro-commitment. Homeowner lane only.
  if(SCRIPT.frame){
    b += '<div class="ltag">THE FRAME &mdash; set this BEFORE any question</div>'
       + say(SCRIPT.frame.en, SCRIPT.frame.es, r);
  }

  // NEPQ question stack -- only after the opener lands. Get them talking; the problem sells itself.
  if(SCRIPT.q && SCRIPT.q.length){
    b += '<div class="ltag">GET THEM TALKING &mdash; '+SCRIPT.q.length+' BEATS, IN ORDER</div>';
    SCRIPT.q.forEach(function(q, ix){
      b += '<div class="ltag" style="margin-top:9px">'+(ix+1)+' &middot; '+esc(q.k||'')+'</div>'
        + (q.w ? '<div class="mut" style="font-size:12px">'+esc(q.w)+'</div>' : '')
        + say(q.en, q.es, r);
    });
  }

  // PROBING RAIL (NEPQ) — echo their last words back as a question whenever they go vague. Not a
  // sequence; one-liners he drops in. Homeowner lane only.
  if(SCRIPT.probe && SCRIPT.probe.en && SCRIPT.probe.en.length){
    b += '<div class="ltag">WHEN THEY GET VAGUE &mdash; echo it back, get specific</div>';
    SCRIPT.probe.en.forEach(function(p, ix){
      b += say(p, (SCRIPT.probe.es && SCRIPT.probe.es[ix]) || p, r);
    });
  }

  // BRIDGE (NEPQ Transition Formula) — tie their words + emotion together right before the advisor ask.
  if(SCRIPT.bridge){
    b += '<div class="ltag">THE BRIDGE &mdash; then hand off to the advisor</div>'
       + say(SCRIPT.bridge.en, SCRIPT.bridge.es, r);
  }

  // CIOC as nav — tap a beat, get its words.
  b += '<div class="cioc">';
  SCRIPT.cioc.forEach(function(c,ix){ b += '<button data-cioc="'+ix+'"'+(ciocIdx===ix?' class="on"':'')+'>'+esc(c.k)+'</button>'; });
  b += '</div>';
  if(ciocIdx>=0){
    var c=SCRIPT.cioc[ciocIdx];
    b += '<div class="mut" style="font-size:12px">'+esc(c.w)+'</div><div class="say">'+esc(c.s)+'</div>';
  }

  b += '<div class="ltag">IF YOU ONLY GET 15 SECONDS</div><div class="say">'+esc(fillScript(SCRIPT.f15, r))+'</div>';

  /* VOICEMAIL script, in the sheet so it is one glance away DURING the call (the sheet stays open on
     the outcome screen). Was gated behind a post-call "Done reading" wall; "Left voicemail" now just
     logs and advances. Read live, never a recording (prerecorded/ringless drops need prior express
     written consent under the TCPA). */
  b += '<div class="ltag">IF NO ANSWER &mdash; LEAVE THIS (read it live, no recording)</div>'
     /* Delivery cue (NEPQ tonality) above the words — a voicemail lives on HOW it's said. Muted,
        not spoken; tracks the EN/ES toggle. Homeowner lane only (balloon dict has no vmtone). */
     + (SCRIPT.vmtone ? '<div class="mut" style="font-size:12px;margin:2px 0 7px">'
                        + esc(lang()==='es' && SCRIPT.vmtone.es ? SCRIPT.vmtone.es : SCRIPT.vmtone.en)
                        + '</div>' : '')
     /* the investor lane carries its own voicemail (SCRIPT.vm); the homeowner rescue message is
        the page-level VMEN/VMES and stays exactly what it was for every other row */
     + (SCRIPT.vm ? say(SCRIPT.vm.en, SCRIPT.vm.es, r) : say(VMEN, VMES, r));

  // BUSY / CALL ME BACK (NEPQ Calendar Commitment) — the most common early bail. Flip status: YOUR
  // time is the scarce thing. Its own block so it's one glance away, not buried in the drill pack.
  if(SCRIPT.busy){
    b += '<div class="ltag">&ldquo;I&rsquo;M BUSY / CALL ME BACK&rdquo; &mdash; flip it, don&rsquo;t chase</div>'
       + say(SCRIPT.busy.en, SCRIPT.busy.es, r);
  }

  // OBJECTIONS — tap what you are hearing.
  b += '<div class="ltag">THEY PUSHED BACK &mdash; tap what you heard</div>';
  if(!SCRIPT.obj.length){
    b += '<div class="noes">Objection cards unavailable in this build (drill pack not readable at build time).</div>';
  } else {
    b += '<div class="objs">';
    SCRIPT.obj.forEach(function(o,ix){ b += '<button data-obj="'+ix+'"'+(objIdx===ix?' class="on"':'')+'>'+esc(o.t)+'</button>'; });
    b += '</div>';
    if(objIdx>=0){
      var o=SCRIPT.obj[objIdx];
      b += '<div class="mut" style="font-size:12px;margin-top:6px">They say: &ldquo;'+esc(o.say)+'&rdquo;</div>';
      b += '<div class="ltag">EN</div>';
      o.reb.forEach(function(p){ b += '<div class="say">'+esc(p)+'</div>'; });
      if(o.one) b += '<div class="ltag">IF YOU ONLY GET ONE SENTENCE</div><div class="say">'+esc(o.one)+'</div>';
      if(o.es){
        b += '<div class="mut" style="font-size:12px;margin-top:12px">Dicen: &ldquo;'+esc(o.es.say)+'&rdquo;</div>';
        b += '<div class="ltag es">ES</div>';
        o.es.reb.forEach(function(p){ b += '<div class="say es">'+esc(p)+'</div>'; });
        if(o.es.one) b += '<div class="ltag es">SI SOLO LE DA TIEMPO A UNA FRASE</div><div class="say es">'+esc(o.es.one)+'</div>';
      } else {
        // never a blank card — say plainly that the Spanish does not exist for this one
        b += '<div class="noes">No Spanish version of this card yet.</div>';
      }
    }
  }

  b += '<div class="ltag">'+(SCRIPT===SCRIPT_ALL ? 'MARS &mdash; say this at the TOP of any advisor consult'
                                                 : 'THE FRAME &mdash; a business talking to a business about a rate')+'</div>'
     + '<div class="say">'+esc(SCRIPT.mars)+'</div>';

  b += '<div class="never"><b>NEVER SAY</b><br>';
  SCRIPT.never.forEach(function(n){ b += '&bull; '+esc(n)+'<br>'; });
  b += '</div>';

  $('sbody').innerHTML = b;
  // delegated so the handlers survive every re-render of the body
  Array.prototype.forEach.call($('sbody').querySelectorAll('[data-cioc]'), function(el){
    el.onclick=function(){ ciocIdx = (ciocIdx===+el.dataset.cioc) ? -1 : +el.dataset.cioc; renderSheet(cur); };
  });
  Array.prototype.forEach.call($('sbody').querySelectorAll('[data-obj]'), function(el){
    el.onclick=function(){ objIdx = (objIdx===+el.dataset.obj) ? -1 : +el.dataset.obj; renderSheet(cur); };
  });
  // GUIDED / FULL toggle is rendered in the full sheet too — wire it here as well.
  Array.prototype.forEach.call($('sbody').querySelectorAll('[data-gmode]'), function(el){
    el.onclick=function(){ _g.on=(el.dataset.gmode==='1'); _gSave(); renderSheet(cur); };
  });
  wireLang($('sbody'));
}
$('grip').onclick=sheetToggle;
$('peek').onclick=sheetToggle;

$('pill').onclick=function(){
  /* The pill sits above the sheet grip and used to reload INSTANTLY — mid-call, unconfirmed.
     Off the lead screen (call in progress), reloading needs a deliberate yes. */
  if(SCREEN!=='lead' && !confirm('Load the newer list now? Your logs are saved, but the screen resets to the top of the queue.')) return;
  location.reload();
};
/* Returning to the page means he just finished a call. Pull then (teammate opt-outs matter before
   the next dial) and re-check freshness. Do NOT poll on a 45s timer here — 200k-iteration PBKDF2
   every 45s on a backgrounded phone is pure battery burn for a page used in bursts. */
document.addEventListener('visibilitychange',function(){
  if(document.hidden) return;
  freshCheck();
  /* Pull first (teammate opt-outs before the next dial), then PUSH: the push fired just before
     the dialer opened may have died when the tab backgrounded — returning is the retry moment. */
  try{ if(localStorage.getItem('fcTeamKey')){ syncPull().then(function(){ loadNotes();
    /* THE POINT OF THE PULL. The merge just wrote whatever the other phone did while this one
       was in the dialer — re-check the lead on screen before he dials it. Without this line the
       fresh teammate outcome sits in notes and changes nothing until the next full repaint. */
    try{ teamRecheck(); }catch(e){}
    try{ teamWatch(); }catch(e){}
    if(touched) return syncPush(); }).catch(function(){}); } }catch(e){}
});
/* THE BACKGROUND TICK. startTeamSync() already pulls every 45s, but nothing consumed the result
   while the page stayed in the foreground — teamRecheck was wired to visibilitychange alone, so
   a teammate's outcome only ever surfaced when he left the app and came back. Reading a card for
   two minutes while Carlos worked that same lead showed him nothing.
   This polls the merged notes instead of the network: no fetch, no extra sync traffic, just a
   diff of what syncPull already wrote. 20s so a fresh outcome lands inside the window between
   reading a card and tapping dial, and teamWatch's case+timestamp dedup means a tick with
   nothing new is silent. */
setInterval(function(){ try{ if(localStorage.getItem('fcTeamKey')) teamWatch(); }catch(e){} }, 20000);
boot();
</script></body></html>
